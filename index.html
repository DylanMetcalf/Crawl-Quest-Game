function runEveryoneSpinsSequence(done){
  const opts=["+5 pts","+10 pts","+15 pts","+20 pts","+25 pts","+30 pts"];
  let idx=0;
  const next=()=>{
    if(idx>=state.players.length){ done(); return; }
    const p=state.players[idx];
    openWheel(p.name+"'s bonus spin", opts, (landedText)=>{
      const pts = landedText ? (parseInt(landedText,10)||10) : 10;
      const f=awardPoints(idx,pts,{noCombo:true});
      logToStop({player:p.name,type:"sidequest",text:"[Everyone Spins]",pts:f});
      idx++;
      next();
    }, {closeLabel: idx===state.players.length-1 ? "Nice — continue →" : "Next player's spin →"});
  };
  next();
}
function maybeChaosEvent(done, force){
  const trigger = force || Math.random()<=0.14;
  if(!trigger){ done(); return; }
  const waitThenShow=()=>{
    if(chaosQueueBusy){ setTimeout(waitThenShow,300); return; }
    const ev=pickAndApplyChaos();
    showChaosBanner(ev, done);
  };
  waitThenShow();
}
function applyChaosEvent(ev){
  const ps=state.players;
  if(ev.key==="score_swap"){
    let lead=0,last=0;
    ps.forEach((p,i)=>{ if(p.score>ps[lead].score)lead=i; if(p.score<ps[last].score)last=i; });
    if(lead!==last){ const t=ps[lead].score; ps[lead].score=ps[last].score; ps[last].score=t; unlockAchievement(last,'chaos_agent'); }
  }
  else if(ev.key==="wedge_heist"){
    let most=0; ps.forEach((p,i)=>{ if(p.wedges>ps[most].wedges) most=i; });
    if(ps[most].wedges>0){
      const others=ps.map((p,i)=>i).filter(i=>i!==most);
      const t=others[Math.floor(Math.random()*others.length)];
      ps[most].wedges--; ps[t].wedges=Math.min(MAX_WEDGES,ps[t].wedges+1);
      unlockAchievement(t,'chaos_agent');
    }
  }
  else if(ev.key==="double_forfeit"){
    const idxs=shuffle(ps.map((p,i)=>i)).slice(0,Math.min(2,ps.length));
    idxs.forEach(i=>triggerForfeit(i,()=>{}));
  }
  else if(ev.key==="mystery_bonus"){
    const i=Math.floor(Math.random()*ps.length);
    const swing=Math.round((Math.random()*40)-15);
    if(swing>=0){ awardPoints(i,swing,{noCombo:true}); unlockAchievement(i,'chaos_agent'); } else ps[i].score=Math.max(0,ps[i].score+swing);
  }
  else if(ev.key==="everyone_spins"){
    // handled interactively in showChaosBanner's dismiss flow — see
    // runEveryoneSpinsSequence, so players actually get to spin a wheel
    // instead of quietly receiving points with nothing to watch.
  }
  else if(ev.key==="reverse_round"){
    state.reverseRoundActive=true;
  }
  else if(ev.key==="wedge_rain"){
    ps.forEach(p=>{ p.wedges=Math.min(MAX_WEDGES,p.wedges+1); });
  }
  else if(ev.key==="point_storm"){
    ps.forEach((p,i)=>{ const swing=Math.round((Math.random()*30)-10); if(swing>=0) awardPoints(i,swing,{noCombo:true}); else p.score=Math.max(0,p.score+swing); });
  }
}

/* ---- MINI-GAME: REACTION DUEL ---- */
function runReactionDuel(which, results){
  const ov=document.getElementById('battleOverlay');
  if(!ov){ state.stopPhase="summary"; render(); return; }
  ov.classList.remove('hidden');
  const inner=document.getElementById('battleInner');
  const pIdx=state.battlePair[which], p=state.players[pIdx];
  inner.innerHTML=`<div class="arcade" style="color:var(--c4);font-size:12px;margin-bottom:10px;">${p.name.toUpperCase()}, GET READY</div>
    <div style="display:flex;justify-content:center;margin-bottom:10px;">${personSVG(p.avatar,60)}</div>
    <button class="btn pink block" id="goReact">START — WAIT FOR GREEN</button>`;
  document.getElementById('goReact').onclick=()=>{
    inner.innerHTML=`<div class="tap-target" id="reactBox" style="background:radial-gradient(circle,${'#7a1520'},var(--panel)); border-color:var(--c6);">WAIT...<small>don't tap yet</small></div>`;
    const box=document.getElementById('reactBox');
    const delay=900+Math.random()*2200;
    let ready=false, tooSoon=false, start=0;
    const early=()=>{
      if(ready) return;
      tooSoon=true;
      box.style.background='var(--panel)'; box.textContent='TOO SOON'; box.removeEventListener('pointerdown',early);
      setTimeout(()=>finishReactionTurn(which,results,9999),700);
    };
    box.addEventListener('pointerdown',early);
    setTimeout(()=>{
      if(tooSoon) return;
      ready=true; start=performance.now();
      box.style.background='radial-gradient(circle,#1fbf6a,var(--panel))'; box.style.borderColor='var(--c3)';
      box.textContent='TAP NOW!';
      box.removeEventListener('pointerdown',early);
      box.addEventListener('pointerdown',()=>{
        const rt=Math.round(performance.now()-start);
        box.textContent=rt+'ms';
        finishReactionTurn(which,results,rt);
      },{once:true});
    },delay);
  };
}
function finishReactionTurn(which,results,rt){
  results[state.battlePair[which]]=rt;
  setTimeout(()=>{
    const inner=document.getElementById('battleInner');
    if(which===0){
      inner.innerHTML=`<div class="arcade" style="font-size:13px;color:var(--c3);margin-bottom:8px;">${rt>=9999?'TOO SOON':rt+'ms'}</div>
        <div style="font-size:13px;color:var(--ink-dim);margin-bottom:14px;">Pass the phone to ${state.players[state.battlePair[1]].name}.</div>
        <button class="btn block" id="next2r">Next Player →</button>`;
      document.getElementById('next2r').onclick=()=>runReactionDuel(1,results);
    } else {
      finishReactionDuel(results);
    }
  },500);
}
function finishReactionDuel(results){
  const [i1,i2]=state.battlePair;
  const a=results[i1], b=results[i2];
  const ov=document.getElementById('battleOverlay');
  const inner=document.getElementById('battleInner');
  let winIdx=null;
  if(a<b) winIdx=i1; else if(b<a) winIdx=i2;
  const stake=state.battleStake||20;
  const fmt=v=>v>=9999?'Too soon':v+'ms';
  inner.innerHTML=`<div class="arcade" style="font-size:12px;color:var(--c4);margin-bottom:12px;">REACTION TIMES</div>
    <div style="display:flex;gap:16px;justify-content:center;margin-bottom:16px;">
      <div><div style="font-family:'Press Start 2P';font-size:14px;color:${winIdx===i1?'var(--c3)':'var(--ink-dim)'}">${fmt(a)}</div><div style="font-size:12px;margin-top:4px;">${state.players[i1].name}</div></div>
      <div><div style="font-family:'Press Start 2P';font-size:14px;color:${winIdx===i2?'var(--c3)':'var(--ink-dim)'}">${fmt(b)}</div><div style="font-size:12px;margin-top:4px;">${state.players[i2].name}</div></div>
    </div>
    <button class="btn block" id="battleDoneR">${winIdx===null?'Draw — no points':state.players[winIdx].name+' takes +'+stake}</button>`;
  document.getElementById('battleDoneR').onclick=()=>{
    ov.classList.add('hidden');
    if(winIdx!==null){
      const f=awardPoints(winIdx,stake,{noCombo:true});
      logToStop({player:state.players[winIdx].name,type:"challenge",text:"[Reaction Duel] "+fmt(results[winIdx]),pts:f});
      celebrate(winIdx,"FASTEST REFLEXES!",fmt(results[winIdx]), true);
      playSound('win');
      registerMinigameWin(winIdx);
      setTimeout(()=>{state.stopPhase="summary";render();},1600);
    } else { logToStop({player:"Both",type:"challenge",text:"[Reaction Duel] drew",pts:0}); state.stopPhase="summary"; render(); }
  };
}

/* ---- MINI-GAME: PATTERN MEMORY ---- */
const MEM_COLORS=[{c:'var(--c1)',n:'PINK'},{c:'var(--c2)',n:'CYAN'},{c:'var(--c3)',n:'LIME'},{c:'var(--c4)',n:'GOLD'}];

/* --- TRIVIA BLITZ content: self-contained Q + correct + 2 decoys, so the
   mini-game can auto-grade a tap instead of needing group judging. --- */
const TRIVIA_MCQ = [
  {q:"What mountain overlooks Cape Town's city bowl?", correct:"Table Mountain", decoys:["Lion's Head","Signal Hill"]},
  {q:"What's the local word for a barbecue?", correct:"Braai", decoys:["Bunny chow","Potjie"]},
  {q:"Which island was Nelson Mandela imprisoned on?", correct:"Robben Island", decoys:["Dassen Island","Seal Island"]},
  {q:"What year did South Africa host the FIFA World Cup?", correct:"2010", decoys:["2006","2014"]},
  {q:"How many official languages does South Africa have?", correct:"11", decoys:["9","6"]},
  {q:"What's the currency of South Africa?", correct:"Rand", decoys:["Pula","Shilling"]},
  {q:"Which ocean is on Cape Town's Atlantic Seaboard?", correct:"Atlantic", decoys:["Indian","Pacific"]},
  {q:"What's a bunny chow traditionally served in?", correct:"A hollowed loaf of bread", decoys:["A clay pot","A banana leaf"]},
  {q:"What's the tallest building in Cape Town's city centre roughly known as?", correct:"The Portside Tower", decoys:["Table Bay Tower","Longkloof Tower"]},
  {q:"Which of these is a real Cape Town neighbourhood famous for painted houses?", correct:"Bo-Kaap", decoys:["Green Point","Sea Point"]},
];
function runMemoryDuel(which, results){
  const ov=document.getElementById('battleOverlay');
  if(!ov){ state.stopPhase="summary"; render(); return; }
  ov.classList.remove('hidden');
  const inner=document.getElementById('battleInner');
  const pIdx=state.battlePair[which], p=state.players[pIdx];
  const seqLen=4+Math.floor(Math.random()*2);
  const seq=Array.from({length:seqLen},()=>Math.floor(Math.random()*4));
  inner.innerHTML=`<div class="arcade" style="color:var(--c4);font-size:12px;margin-bottom:10px;">${p.name.toUpperCase()}, WATCH CLOSELY</div>
    <div style="display:flex;justify-content:center;margin-bottom:10px;">${personSVG(p.avatar,50)}</div>
    <button class="btn pink block" id="goMem">START SEQUENCE</button>`;
  document.getElementById('goMem').onclick=()=>{
    inner.innerHTML=`<div class="arcade" style="font-size:11px;color:var(--ink-dim);margin-bottom:14px;">MEMORISE...</div>
      <div id="memPad" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:220px;margin:0 auto;">
        ${MEM_COLORS.map((mc,i)=>`<div data-mc="${i}" style="height:70px;border-radius:12px;background:${mc.c};opacity:.35;transition:opacity .15s;"></div>`).join('')}
      </div>`;
    const cells=[...document.querySelectorAll('#memPad [data-mc]')];
    let step=0;
    const flash=()=>{
      if(step>=seq.length){ startInput(); return; }
      const cell=cells[seq[step]];
      cell.style.opacity='1';
      setTimeout(()=>{ cell.style.opacity='.35'; step++; setTimeout(flash,220); },420);
    };
    setTimeout(flash,500);
    function startInput(){
      const start=performance.now();
      let idx=0, wrong=false;
      const label=document.createElement('div');
      label.className='arcade'; label.style.cssText='font-size:11px;color:var(--c3);margin-top:14px;';
      label.textContent='YOUR TURN — REPEAT IT';
      document.getElementById('battleInner').appendChild(label);
      cells.forEach((cell,ci)=>{
        cell.style.cursor='pointer';
        cell.onclick=()=>{
          if(wrong||idx>=seq.length) return;
          cell.style.opacity='1'; setTimeout(()=>cell.style.opacity='.35',150);
          if(ci!==seq[idx]){ wrong=true; label.textContent='WRONG SEQUENCE'; label.style.color='var(--c6)'; setTimeout(()=>finishMemoryTurn(which,results,null),700); return; }
          idx++;
          if(idx===seq.length){ const t=Math.round(performance.now()-start); label.textContent='CORRECT! '+t+'ms'; label.style.color='var(--c3)'; setTimeout(()=>finishMemoryTurn(which,results,t),700); }
        };
      });
    }
  };
}
function finishMemoryTurn(which,results,timeMs){
  results[state.battlePair[which]]=timeMs;
  const inner=document.getElementById('battleInner');
  if(which===0){
    inner.innerHTML=`<div style="font-size:13px;color:var(--ink-dim);margin:14px 0;">Pass the phone to ${state.players[state.battlePair[1]].name}.</div>
      <button class="btn block" id="next2m">Next Player →</button>`;
    document.getElementById('next2m').onclick=()=>runMemoryDuel(1,results);
  } else finishMemoryDuel(results);
}
function finishMemoryDuel(results){
  const [i1,i2]=state.battlePair;
  const a=results[i1], b=results[i2];
  const ov=document.getElementById('battleOverlay');
  const inner=document.getElementById('battleInner');
  let winIdx=null;
  if(a!==null && b===null) winIdx=i1;
  else if(b!==null && a===null) winIdx=i2;
  else if(a!==null && b!==null){ winIdx = a<b ? i1 : (b<a ? i2 : null); }
  const stake=state.battleStake||20;
  const fmt=v=>v===null?'Failed':v+'ms';
  inner.innerHTML=`<div class="arcade" style="font-size:12px;color:var(--c4);margin-bottom:12px;">RESULTS</div>
    <div style="display:flex;gap:16px;justify-content:center;margin-bottom:16px;">
      <div><div style="font-family:'Press Start 2P';font-size:13px;color:${winIdx===i1?'var(--c3)':'var(--ink-dim)'}">${fmt(a)}</div><div style="font-size:12px;margin-top:4px;">${state.players[i1].name}</div></div>
      <div><div style="font-family:'Press Start 2P';font-size:13px;color:${winIdx===i2?'var(--c3)':'var(--ink-dim)'}">${fmt(b)}</div><div style="font-size:12px;margin-top:4px;">${state.players[i2].name}</div></div>
    </div>
    <button class="btn block" id="battleDoneM">${winIdx===null?'Draw — no points':state.players[winIdx].name+' takes +'+stake}</button>`;
  document.getElementById('battleDoneM').onclick=()=>{
    ov.classList.add('hidden');
    if(winIdx!==null){
      const f=awardPoints(winIdx,stake,{noCombo:true});
      logToStop({player:state.players[winIdx].name,type:"challenge",text:"[Pattern Memory] "+fmt(results[winIdx]),pts:f});
      celebrate(winIdx,"SHARPEST MEMORY!",fmt(results[winIdx]), true);
      playSound('win');
      registerMinigameWin(winIdx);
      setTimeout(()=>{state.stopPhase="summary";render();},1600);
    } else { logToStop({player:"Both",type:"challenge",text:"[Pattern Memory] drew",pts:0}); state.stopPhase="summary"; render(); }
  };
}

/* ---- MINI-GAME: TRIVIA BLITZ (knowledge — both players race the same question) ---- */
function runTriviaDuel(){
  const ov=document.getElementById('battleOverlay');
  if(!ov){ state.stopPhase="summary"; render(); return; }
  ov.classList.remove('hidden');
  const inner=document.getElementById('battleInner');
  const q=TRIVIA_MCQ[Math.floor(Math.random()*TRIVIA_MCQ.length)];
  const options=shuffle([q.correct, ...q.decoys]);
  const [i1,i2]=state.battlePair;
  inner.innerHTML=`<div class="arcade" style="color:var(--c4);font-size:12px;margin-bottom:12px;">TRIVIA BLITZ</div>
    <div style="font-size:14px;font-weight:600;margin-bottom:16px;line-height:1.4;">${q.q}</div>
    <div style="font-size:10.5px;color:var(--ink-dim);margin-bottom:10px;">Both players tap at once — whoever taps the right answer first wins. A wrong tap is an instant loss.</div>
    <div id="triviaOpts" style="display:flex;flex-direction:column;gap:10px;">
      ${options.map((o,i)=>`<button class="btn secondary" data-opt="${i}" style="text-align:left;">${o}</button>`).join('')}
    </div>`;
  const start=performance.now();
  let settled=false;
  const winnerSlot={}; // which physical tap area "belongs" to which player isn't tracked on a shared phone — first valid tap wins outright
  document.querySelectorAll('#triviaOpts [data-opt]').forEach(btn=>{
    btn.onclick=()=>{
      if(settled) return;
      settled=true;
      const chosen=options[+btn.dataset.opt];
      const correct = chosen===q.correct;
      const rt=Math.round(performance.now()-start);
      finishTriviaDuel(q, chosen, correct, rt);
    };
  });
}
function finishTriviaDuel(q, chosen, correct, rt){
  const ov=document.getElementById('battleOverlay');
  const inner=document.getElementById('battleInner');
  const stake=state.battleStake||20;
  // Whoever tapped is credited to whichever of the two duel players is
  // currently active/first in the turn queue if it's their card, otherwise
  // ask the group who actually tapped — keep it simple: award to the first
  // battlePair player when correct, prompt a quick "who tapped?" choice.
  inner.innerHTML=`<div class="arcade" style="font-size:12px;color:${correct?'var(--c3)':'var(--c6)'};margin-bottom:10px;">${correct?'CORRECT!':'WRONG ANSWER'}</div>
    <div style="font-size:12.5px;color:var(--ink-dim);margin-bottom:14px;">The answer was <b style="color:var(--ink);">${q.correct}</b> (${rt}ms)</div>
    ${correct?`<div style="font-size:11.5px;margin-bottom:10px;">Who tapped it?</div>
      <div style="display:flex;gap:10px;justify-content:center;">
        ${state.battlePair.map(i=>`<button class="btn" data-who="${i}">${state.players[i].name}</button>`).join('')}
      </div>`
      : `<button class="btn block" id="triviaDoneWrong">Continue — no points</button>`}
  `;
  if(correct){
    document.querySelectorAll('[data-who]').forEach(btn=>{
      btn.onclick=()=>{
        const winIdx=+btn.dataset.who;
        ov.classList.add('hidden');
        const f=awardPoints(winIdx,stake,{noCombo:true});
        logToStop({player:state.players[winIdx].name,type:"challenge",text:"[Trivia Blitz] "+q.q,pts:f});
        celebrate(winIdx,"TRIVIA BLITZ WIN!","+"+f+" points", true);
        playSound('win');
        registerMinigameWin(winIdx);
        setTimeout(()=>{state.stopPhase="summary";render();},1600);
      };
    });
  } else {
    document.getElementById('triviaDoneWrong').onclick=()=>{
      ov.classList.add('hidden');
      logToStop({player:"Both",type:"challenge",text:"[Trivia Blitz] wrong answer, no winner",pts:0});
      state.stopPhase="summary"; render();
    };
  }
}

/* ---- STATS / BOWLING SCOREBOARD SCREEN ---- */
function renderStats(){
  const stops=state.route.filter(s=>s.done || s===state.route[state.currentStop]);
  const rows = state.players.map(p=>{
    let running=0;
    const cells = state.route.map(s=>{
      const pts = s.log.filter(l=>l.player===p.name).reduce((sum,l)=>sum+(l.pts||0),0);
      running += pts;
      return {pts, running, done:s.done};
    });
    return {p, cells, total:running};
  });
  let biggestSwing=0, biggestSwingStop='';
  state.route.forEach(s=>{
    const perPlayer={};
    s.log.forEach(l=>{ perPlayer[l.player]=(perPlayer[l.player]||0)+(l.pts||0); });
    const vals=Object.values(perPlayer);
    if(vals.length){ const spread=Math.max(...vals)-Math.min(...vals,0); if(spread>biggestSwing){ biggestSwing=spread; biggestSwingStop=s.name; } }
  });
  const bounty=state.activeBounty;
  return `${navBar('stats')}
  <div class="panel">
    <h3>📊 CRAWL SCOREBOARD</h3>
    <div style="overflow-x:auto;">
    <table class="sb-table"><thead><tr><th>Player</th>${state.route.map((s,i)=>`<th>${s.icon}</th>`).join('')}<th>Total</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td>${r.p.name}</td>${r.cells.map(c=>`<td style="color:${c.pts>0?'var(--c3)':'var(--ink-dim)'};">${c.done||c.pts?(c.pts>0?'+'+c.pts:'—'):''}</td>`).join('')}<td><b style="color:var(--c4);">${r.total}</b></td></tr>`).join('')}</tbody></table>
    </div>
    ${biggestSwing>0?`<div style="font-size:11px;color:var(--ink-dim);margin-top:10px;">Biggest single-stop swing: <b style="color:var(--c1);">${biggestSwing} pts</b> at ${biggestSwingStop}</div>`:''}
  </div>
  ${bounty?`<div class="bounty-card"><b>🎯 ACTIVE BOUNTY</b>${bounty.text}</div>`:''}
  <div class="panel">
    <h3>🗺️ OBJECTIVES</h3>
    ${state.crawlDNA ? state.crawlDNA.objectives.map(key=>{
      const def=OBJECTIVES.find(o=>o.key===key);
      if(!def) return '';
      const doneBy=state.players.filter(p=>p.objectiveProgress[key]).map(p=>p.name);
      return `<div class="objective-row"><div class="ostat">${doneBy.length?'✅':'⬜'}</div>
        <div style="flex:1;">${def.text}${doneBy.length?`<div style="font-size:10px;color:var(--c3);">Cleared by ${doneBy.join(', ')}</div>`:''}</div></div>`;
    }).join('') : '<div style="color:var(--ink-dim);font-size:12px;">No objectives generated yet.</div>'}
  </div>
  <div class="panel">
    <h3>🏆 ACHIEVEMENTS</h3>
    <div class="ach-grid">
    ${ACHIEVEMENTS.map(a=>{
      const holders=state.players.filter(p=>p.achievements.includes(a.key));
      const unlocked=holders.length>0;
      if(a.hidden && !unlocked) return `<div class="ach-row"><div class="ach-icon">❓</div><div><div class="ach-name">???</div><div class="ach-desc">Hidden achievement</div></div></div>`;
      return `<div class="ach-row ${unlocked?'unlocked':''}"><div class="ach-icon">${unlocked?'🏅':'🔒'}</div>
        <div><div class="ach-name">${a.name}${unlocked?' — '+holders.map(h=>h.name).join(', '):''}</div><div class="ach-desc">${a.desc}</div></div></div>`;
    }).join('')}
    </div>
  </div>
  <button class="btn ghost" data-do="endCrawl" style="width:100%;">End Crawl Early</button>
  <button class="btn secondary block" id="backToPlay3">← Back to Play</button>`;
}

boot();

  });
