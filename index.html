<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>CRAWL QUEST</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crawl Quest">
<meta name="theme-color" content="#0a0118">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#0a0118; --void2:#170a2c; --panel:#1c0e34; --panel2:#150a29;
  --edge:rgba(255,255,255,0.10);
  --c1:#ff2fa6; --c2:#25e6ff; --c3:#c6ff3d; --c4:#ffb703; --c5:#8b3dff; --c6:#ff3b5c;
  --ink:#f3f0ff; --ink-dim:#b8a9d9;
  --shadow:0 16px 38px rgba(0,0,0,0.6);
}
/* THEMES */
body[data-theme="neon"]{--void:#0a0118;--void2:#170a2c;--panel:#1c0e34;--panel2:#150a29;--c1:#ff2fa6;--c2:#25e6ff;--c3:#c6ff3d;--c4:#ffb703;--c5:#8b3dff;--c6:#ff3b5c;--ink:#f3f0ff;--ink-dim:#b8a9d9;}
body[data-theme="sunset"]{--void:#1a0512;--void2:#2e0a1e;--panel:#3a0f25;--panel2:#2a0a1a;--c1:#ff6b35;--c2:#ffd23f;--c3:#ff9f1c;--c4:#ffe66d;--c5:#e84855;--c6:#ff4365;--ink:#fff4e6;--ink-dim:#e0b8a0;}
body[data-theme="mint"]{--void:#03181a;--void2:#052a2e;--panel:#07373d;--panel2:#052a2e;--c1:#00f5d4;--c2:#00bbf9;--c3:#9bf6ff;--c4:#fee440;--c5:#38b000;--c6:#ff5c8a;--ink:#eafffa;--ink-dim:#95c9c4;}
body[data-theme="mono"]{--void:#0b0b0f;--void2:#15151c;--panel:#1e1e28;--panel2:#17171f;--c1:#ffffff;--c2:#b0b0c0;--c3:#e8e8f0;--c4:#ffd700;--c5:#7a7a90;--c6:#ff4d4d;--ink:#f5f5fa;--ink-dim:#9a9aae;}
body[data-theme="vapor"]{--void:#12042a;--void2:#1e0846;--panel:#2a0d5c;--panel2:#1e0846;--c1:#ff71ce;--c2:#01cdfe;--c3:#05ffa1;--c4:#fffb96;--c5:#b967ff;--c6:#ff6b9d;--ink:#fdf6ff;--ink-dim:#c9a8e0;}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{min-height:100vh; font-family:'Space Grotesk',sans-serif; color:var(--ink);
  background:linear-gradient(180deg, var(--void) 0%, var(--void2) 100%); overflow-x:hidden;}
.grid-floor{position:fixed; left:-10%; right:-10%; bottom:0; height:34vh;
  background-image:linear-gradient(color-mix(in srgb, var(--c1) 28%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--c2) 24%, transparent) 1px, transparent 1px);
  background-size:38px 38px; transform:perspective(280px) rotateX(58deg); transform-origin:bottom; opacity:.55; pointer-events:none; z-index:0;}
body::after{content:""; position:fixed; inset:0; z-index:2; pointer-events:none; opacity:.28;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.4) 0 1px, transparent 1px 3px);}
body::before{content:""; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.7;
  background-image:radial-gradient(1.5px 1.5px at 15% 12%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 8%,#fff,transparent),radial-gradient(1px 1px at 40% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 85% 25%,#fff,transparent),radial-gradient(1px 1px at 55% 5%,#fff,transparent);}
.wrap{position:relative; z-index:1; max-width:520px; margin:0 auto; padding:calc(20px + env(safe-area-inset-top, 0px) + 22px) 16px 100px;}
.arcade{font-family:'Press Start 2P',cursive; letter-spacing:.5px; line-height:1.5;}

.hero{text-align:center; padding:10px 4px 6px;}
.hero .kicker{font-size:10px; color:var(--c2); margin-bottom:10px;}
.hero h1{font-size:22px; margin:0 0 8px; color:var(--c1); text-shadow:0 0 10px color-mix(in srgb,var(--c1) 60%,transparent),3px 3px 0 rgba(0,0,0,.5);}
.hero h1 small{display:block; font-size:11px; color:var(--c4); margin-top:8px; text-shadow:none;}
.hero p{color:var(--ink-dim); font-size:13.5px; margin:0 auto; max-width:360px; line-height:1.6;}

.btn{border:2px solid transparent; border-radius:10px; padding:13px 16px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:14px; cursor:pointer; color:var(--void);
  background:linear-gradient(135deg,var(--c3),color-mix(in srgb,var(--c3) 70%,#000)); box-shadow:0 6px 0 rgba(0,0,0,.5); transition:transform .08s ease;}
.btn:active{transform:translateY(5px); box-shadow:0 1px 0 rgba(0,0,0,.5);}
.btn.secondary{background:var(--panel); color:var(--ink); border:2px solid var(--edge);}
.btn.pink{background:linear-gradient(135deg,var(--c1),color-mix(in srgb,var(--c1) 65%,#000)); color:#fff;}
.btn.wild{background:linear-gradient(135deg,var(--c5),color-mix(in srgb,var(--c5) 65%,#000)); color:#fff;}
.btn.amber{background:linear-gradient(135deg,var(--c4),color-mix(in srgb,var(--c4) 70%,#000));}
.btn.block{width:100%; display:block;}
.btn.sm{padding:9px 10px; font-size:12px; border-radius:8px;}
.btn.ghost{background:transparent; box-shadow:none; border:none; color:var(--ink-dim); text-decoration:underline; padding:8px;}
.btn.ghost.donGamble{color:var(--c6); text-decoration:none; border:1.5px solid var(--c6); border-radius:10px; padding:10px 12px; width:100%; font-weight:700; animation:gamble-pulse 1.4s ease-in-out infinite;}
@keyframes gamble-pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c6) 40%,transparent);} 50%{box-shadow:0 0 0 6px transparent;}}
.btn:disabled{opacity:.35; cursor:not-allowed; box-shadow:none; transform:none;}

.panel{background:linear-gradient(180deg,var(--panel),var(--panel2)); border:2px solid var(--edge); border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:var(--shadow);}
.panel h3{font-size:11.5px; margin:0 0 12px; color:var(--c2); font-family:'Press Start 2P',cursive;}
.panel.neon{border-color:var(--c1);}

label{display:block; font-size:12px; color:var(--ink-dim); margin:0 0 5px;}
input[type=text]{width:100%; padding:11px 12px; border-radius:8px; border:2px solid var(--edge); background:rgba(0,0,0,.35); color:var(--ink); font-family:inherit; font-size:14px; margin-bottom:10px;}
input[type=text]:focus{outline:none; border-color:var(--c2);}
.toggle-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 2px;}
.toggle-row div{font-size:13px; line-height:1.4;}
.toggle-row small{display:block; color:var(--ink-dim); font-weight:400; margin-top:2px;}
.switch{position:relative; width:48px; height:26px; flex:none;}
.switch input{opacity:0; width:0; height:0;}
.slider{position:absolute; inset:0; background:rgba(255,255,255,.15); border-radius:6px; cursor:pointer; transition:.2s; border:2px solid var(--edge);}
.slider::before{content:""; position:absolute; width:18px; height:18px; left:2px; top:2px; background:var(--ink); border-radius:4px; transition:.2s;}
.switch input:checked + .slider{background:linear-gradient(135deg,var(--c1),color-mix(in srgb,var(--c1) 60%,#000)); border-color:var(--c1);}
.switch input:checked + .slider::before{transform:translateX(20px);}

.tab-bar{display:flex; gap:6px; margin-bottom:14px; overflow-x:auto; padding-bottom:2px;}
.tab-bar button{flex:none; padding:9px 12px; border-radius:8px; border:2px solid var(--edge); background:var(--panel); color:var(--ink-dim); font-weight:700; font-size:11.5px; cursor:pointer; white-space:nowrap;}
.tab-bar button.active{background:linear-gradient(135deg,var(--c2),color-mix(in srgb,var(--c2) 60%,#000)); color:var(--void); border-color:transparent;}
.pill-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;}
.pill{padding:8px 12px; border-radius:20px; border:2px solid var(--edge); background:var(--panel); color:var(--ink-dim); font-size:12px; font-weight:700; cursor:pointer;}
.pill.active{border-color:var(--c3); color:var(--c3);}

.avatar-stage{display:flex; justify-content:center; margin-bottom:12px; min-height:150px; align-items:flex-end;}
.swatch-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;}
.swatch{width:32px; height:32px; border-radius:8px; cursor:pointer; border:3px solid transparent; box-shadow:0 3px 8px rgba(0,0,0,.4);}
.swatch.selected{border-color:var(--ink);}
.style-row{display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap;}
.style-row button{flex:1; min-width:64px; padding:9px 6px; border-radius:10px; border:2px solid var(--edge); background:var(--panel); color:var(--ink-dim); font-weight:700; font-size:11.5px; cursor:pointer;}
.style-row button.active{border-color:var(--c1); color:var(--c1);}
.theme-row{display:flex; gap:8px; flex-wrap:wrap;}
.theme-chip{flex:1; min-width:80px; border-radius:10px; border:2px solid var(--edge); padding:8px; cursor:pointer; text-align:center; font-size:11px; font-weight:700; background:var(--panel);}
.theme-chip.active{border-color:var(--c4);}
.theme-chip .dots{display:flex; gap:3px; justify-content:center; margin-bottom:5px;}
.theme-chip .dots i{width:11px; height:11px; border-radius:3px; display:block;}

.pet-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.pet-card{background:var(--panel); border:2px solid var(--edge); border-radius:12px; padding:12px 8px; text-align:center; cursor:pointer; position:relative;}
.pet-card.selected{border-color:var(--c4);}
.pet-card .em{font-size:30px;}
.pet-card .nm{font-weight:700; font-size:12.5px; margin:5px 0 2px;}
.pet-card .hint{font-size:9.5px; color:var(--ink-dim);}
.pet-card .info{position:absolute; top:6px; right:7px; width:20px; height:20px; border-radius:50%; border:1.5px solid var(--c2); color:var(--c2); font-size:11px; display:flex; align-items:center; justify-content:center; font-weight:700;}

.route-item{background:rgba(0,0,0,.25); border:2px solid var(--edge); border-radius:10px; padding:8px 10px; margin-bottom:8px;}
.route-item-top{display:flex; align-items:center; gap:8px;}
.route-item .num{width:26px; height:26px; border-radius:8px; background:var(--panel2); font-size:14px; display:flex; align-items:center; justify-content:center; flex:none;}
.route-item input{margin:0; flex:1; padding:8px; font-size:13px; margin-bottom:0;}
.route-item .mini{background:none; border:none; color:var(--ink-dim); font-size:15px; padding:4px 6px; cursor:pointer;}
.route-item.pin .num{background:linear-gradient(135deg,var(--c4),color-mix(in srgb,var(--c4) 60%,#000)); color:var(--void);}
.pubgolf-toggle{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--ink-dim); margin-top:6px; padding-left:34px;}
.golf-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; max-width:320px; margin:0 auto;}
.golf-grid button{padding:14px 0; font-size:15px; font-weight:700;}

.pass-card{text-align:center; padding:26px 14px;}
.secret-box{background:rgba(0,0,0,.4); border:2px dashed var(--c4); border-radius:12px; padding:18px; margin:14px 0; font-size:14.5px; font-weight:600; line-height:1.4;}
.blur-box{filter:blur(8px); user-select:none; transition:filter .3s;}
.blur-box.revealed{filter:blur(0);}

.top-nav{display:flex; gap:6px; margin-bottom:12px;}
.top-nav button{flex:1; padding:9px 4px; border-radius:8px; border:2px solid var(--edge); background:var(--panel); color:var(--ink-dim); font-weight:700; font-size:10.5px; cursor:pointer;}
.top-nav button.active{background:linear-gradient(135deg,var(--c1),color-mix(in srgb,var(--c1) 60%,#000)); color:#fff; border-color:transparent;}

.title-screen{text-align:center; padding:28px 14px;}
.title-screen .stop-icon{font-size:56px; margin-bottom:10px;}
.title-screen h2{font-size:15px; margin:0 0 6px; color:var(--c1);}
.title-screen p{color:var(--ink-dim); font-size:13px; margin:0 0 18px;}
.badge{display:inline-block; padding:5px 10px; border-radius:8px; background:color-mix(in srgb,var(--c3) 15%,transparent); color:var(--c3); font-size:10.5px; font-weight:700; border:1px solid var(--c3); margin:0 3px 10px;}
.badge.pub{background:color-mix(in srgb,var(--c4) 15%,transparent); color:var(--c4); border-color:var(--c4);}
.rule-banner{background:color-mix(in srgb,var(--c5) 18%,transparent); border:1.5px solid var(--c5); border-radius:10px; padding:9px 11px; text-align:left; font-size:11.5px; color:var(--ink-dim); margin-bottom:12px; line-height:1.4;}
.rule-banner b{display:block; font-family:'Press Start 2P'; font-size:10px; color:var(--c5); margin-bottom:3px;}
.rule-banner.sm{margin-bottom:10px;}
.rule-banner.event{border-color:var(--c1); background:color-mix(in srgb,var(--c1) 16%,transparent);}
.rule-banner.event b{color:var(--c1);}
.event-detail{margin-top:5px; font-weight:700; color:var(--ink);}
.combo-badge{display:inline-block; font-size:9.5px; font-weight:800; color:var(--c4); margin-left:4px;}
.chaos-banner{position:fixed; inset:0; z-index:92; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(20,0,10,.92); text-align:center; padding:24px;}
.chaos-banner .cb-icon{font-size:52px; animation:chaos-shake .35s infinite;}
@keyframes chaos-shake{0%,100%{transform:rotate(-4deg);}50%{transform:rotate(4deg);}}
.chaos-banner .cb-title{font-family:'Press Start 2P'; font-size:18px; color:var(--c6); margin:14px 0 10px; text-shadow:0 0 16px var(--c6);}
.chaos-banner .cb-desc{font-size:14px; color:#fff; max-width:300px; line-height:1.5;}
.mystery-box{width:84px; height:100px; border-radius:12px; background:repeating-linear-gradient(45deg,var(--panel2) 0 6px,var(--panel) 6px 12px); border:2px solid var(--c4); display:flex; align-items:center; justify-content:center; font-size:26px; cursor:pointer;}
.mystery-box:active{transform:scale(.94);}
.bounty-card{background:color-mix(in srgb,var(--c1) 12%,transparent); border:1.5px solid var(--c1); border-radius:12px; padding:10px 12px; margin-bottom:10px; font-size:12px;}
.bounty-card b{display:block; font-family:'Press Start 2P'; font-size:10px; color:var(--c1); margin-bottom:4px;}
.objective-row{display:flex; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid var(--edge); font-size:12px;}
.objective-row:last-child{border-bottom:none;}
.objective-row .ostat{width:20px; text-align:center; flex:none;}
.sb-table{width:100%; border-collapse:collapse; font-size:10.5px;}
.sb-table th,.sb-table td{padding:6px 4px; text-align:center; border-bottom:1px solid var(--edge);}
.sb-table th{color:var(--c2); font-family:'Press Start 2P'; font-size:8px; font-weight:400;}
.sb-table td:first-child,.sb-table th:first-child{text-align:left; position:sticky; left:0; background:var(--panel);}
.ach-grid{display:grid; grid-template-columns:1fr; gap:8px;}
.ach-row{display:flex; gap:10px; align-items:center; background:rgba(0,0,0,.25); border:1.5px solid var(--edge); border-radius:10px; padding:9px 11px;}
.ach-row.unlocked{border-color:var(--c3);}
.ach-icon{font-size:20px; flex:none;}
.ach-name{font-size:12px; font-weight:700;}
.ach-desc{font-size:10.5px; color:var(--ink-dim);}
.sound-toggle{position:fixed; top:calc(10px + env(safe-area-inset-top, 0px)); right:10px; z-index:40; width:36px; height:36px; border-radius:50%; background:var(--panel); border:2px solid var(--edge); display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer;}

.turn-banner{display:flex; align-items:center; gap:10px; background:color-mix(in srgb,var(--c4) 12%,transparent); border:2px solid var(--c4); border-radius:12px; padding:8px 12px; margin-bottom:12px;}
.turn-banner b{font-family:'Press Start 2P'; font-size:10px; color:var(--c4); display:block; margin-bottom:3px;}
.turn-banner span{font-size:11.5px; color:var(--ink-dim);}

.scores{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
.score-card{flex:1; min-width:92px; background:var(--panel); border:2px solid var(--edge); border-radius:12px; padding:10px 6px; text-align:center; cursor:pointer;}
.score-card:active{transform:scale(.97);}
.portal-stats{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:6px;}
.portal-pet{display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.04); border-radius:12px; padding:10px 12px; margin-bottom:10px; text-align:left;}
.portal-pet-em{font-size:34px; flex:none;}
.portal-stat{background:rgba(255,255,255,.04); border-radius:10px; padding:8px 4px;}
.portal-stat b{display:block; font-family:'Press Start 2P'; font-size:13px; color:var(--c4);}
.portal-stat span{font-size:9px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.03em;}
.score-card.lead{border-color:var(--c4);}
.score-card .pname{font-size:11.5px; font-weight:700;}
.score-card .pts{font-family:'Press Start 2P'; font-size:15px; color:var(--c3); margin:4px 0;}
.wedge-row{display:flex; gap:2px; justify-content:center; flex-wrap:wrap;}
.next-wedge-hint{font-size:8.5px; color:var(--ink-dim); text-align:center; margin-top:3px; letter-spacing:.02em;}
.next-wedge-hint.maxed{color:var(--c4);}
.status-strip{display:flex; flex-direction:column; gap:6px; margin:-4px 0 12px;}
.status-chip{font-size:11px; padding:7px 10px; border-radius:9px; line-height:1.35;}
.status-chip.bounty{background:color-mix(in srgb,var(--c1) 14%,transparent); border:1px solid var(--c1); color:var(--ink);}
.status-chip.rule{background:color-mix(in srgb,var(--c5) 16%,transparent); border:1px solid var(--c5); color:var(--ink);}
.wedge-dot{width:8px; height:8px; border-radius:2px; background:rgba(255,255,255,.15);}
.wedge-dot.on{background:var(--c4);}

.action-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px;}
.action-grid .btn{padding:11px 6px; font-size:12px;}
.choice-row{display:flex; gap:10px; justify-content:center; margin:14px 0 4px;}
.mini-card-back{width:78px; height:106px; border-radius:10px; cursor:pointer;
  background:repeating-linear-gradient(45deg,var(--panel2) 0 6px,var(--panel) 6px 12px);
  border:2px solid var(--c1); display:flex; align-items:center; justify-content:center; font-family:'Press Start 2P'; font-size:16px; color:var(--c1); transition:transform .12s;}
.mini-card-back:active{transform:scale(.92);}

.recap-row{display:flex; gap:8px; align-items:flex-start; padding:9px 0; border-bottom:1px solid var(--edge); font-size:12px;}
.recap-row:last-child{border-bottom:none;}
.recap-row .rt{width:62px; flex:none; font-size:8px; background:var(--panel2); border-radius:6px; padding:5px 4px; text-align:center; font-family:'Press Start 2P';}
.recap-row .rtxt{flex:1; color:var(--ink-dim); line-height:1.4;}
.recap-row .rpts{flex:none; font-weight:700; color:var(--c3); font-size:12.5px;}
.recap-row .rpts.zero{color:var(--c6);}

.overlay{position:fixed; inset:0; background:rgba(3,0,10,.88); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;}
.hidden{display:none !important;}
.card-stage{width:100%; max-width:340px; perspective:1200px;}
.flipcard{position:relative; width:100%; height:400px; transform-style:preserve-3d; transition:transform .55s cubic-bezier(.2,.8,.3,1);}
.flipcard.flipped{transform:rotateY(180deg);}
.face{position:absolute; inset:0; backface-visibility:hidden; border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:22px; box-shadow:0 20px 50px rgba(0,0,0,.6);}
.face.back{background:repeating-linear-gradient(45deg,var(--panel2) 0 8px,var(--panel) 8px 16px); border:3px solid var(--c1);}
.face.back .mark{font-family:'Press Start 2P'; font-size:13px; color:var(--void); background:var(--c1); padding:8px 14px; border-radius:8px; margin-bottom:14px;}
.face.back p{color:var(--ink-dim); font-size:12px; max-width:220px;}
.face.front{transform:rotateY(180deg); border:3px solid var(--c2); background:var(--panel); position:relative;}
.flipcard.chaos-card .face.front{border-color:var(--c6); box-shadow:0 0 0 3px color-mix(in srgb,var(--c6) 35%,transparent), 0 20px 50px rgba(0,0,0,.6); animation:chaos-pulse 1.1s ease-in-out infinite;}
@keyframes chaos-pulse{0%,100%{box-shadow:0 0 0 3px color-mix(in srgb,var(--c6) 35%,transparent), 0 20px 50px rgba(0,0,0,.6);} 50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--c6) 55%,transparent), 0 20px 60px rgba(0,0,0,.7);}}

// Escalating wedge thresholds (cumulative score required for the Nth wedge).
// Replaces the old flat 35pt-per-wedge rate, which made wedges trivial to
// earn — most crawls ended with every player maxed out. 100 is the new
// baseline for the first wedge, per design direction, with the gap growing
// each time so the later wedges are genuinely rare, noticed achievements.
const WEDGE_THRESHOLDS = [100, 220, 360, 520, 700, 900, 1120, 1360];
const MAX_WEDGES = WEDGE_THRESHOLDS.length;
const SUMMIT_SCORE = 420;
function wedgesForScore(score){
  let n = 0;
  for(const t of WEDGE_THRESHOLDS){ if(score >= t) n++; else break; }
  return n;
}
function nextWedgeAt(score){
  for(const t of WEDGE_THRESHOLDS){ if(score < t) return t; }
  return null; // maxed out
}

function rollArrivalEvent(stop){
  if(Math.random()>0.45) return null;
  let avail=ARRIVAL_EVENTS.filter(e=>e.key!==state.lastArrivalEventKey);
  if(!avail.length) avail=ARRIVAL_EVENTS.slice();
  const ev=avail[Math.floor(Math.random()*avail.length)];
  state.lastArrivalEventKey=ev.key;
  const detail=ev.run();
  return {key:ev.key, name:ev.name, icon:ev.icon, desc:ev.desc, detail};
}

function isValidState(l){
  if(!l || !Array.isArray(l.players) || !Array.isArray(l.route)) return false;
  if(l.players.length<2 || l.route.length<2) return false;
  return l.players.every(p=>p && typeof p.name==='string' && p.avatar && p.pet);

function migrate(l){
  // backfill anything a older/partial save might be missing
  const d = defaultState();
  const s = Object.assign({}, d, l);
  s.players = l.players.map(p=>{
    const fp = freshPlayer(p.name||'Player');
    const merged = Object.assign(fp, p);
    merged.avatar = Object.assign({}, fp.avatar, p.avatar||{});
    merged.pet = Object.assign({}, fp.pet, p.pet||{});
    if(typeof merged.hiddenChallenge!=='string') merged.hiddenChallenge='';
    if(typeof merged.hiddenPts!=='number') merged.hiddenPts=30;
    if(typeof merged.hiddenTier!=='string') merged.hiddenTier='HARD';
    if(typeof merged.combo!=='number') merged.combo=0;
    if(!Array.isArray(merged.achievements)) merged.achievements=[];
    if(!Array.isArray(merged.bonusPowers)) merged.bonusPowers=[];
    if(!merged.objectiveProgress) merged.objectiveProgress={};
    if(typeof merged.score!=='number' || isNaN(merged.score)) merged.score=0;
    if(typeof merged.wedges!=='number' || isNaN(merged.wedges)) merged.wedges=0;
    return merged;
  });
  s.route = l.route.map((r,i)=>Object.assign({
    name:'Stop '+(i+1), note:'', pin:false, pubgolf:false,
    icon:STOP_ICONS[i%STOP_ICONS.length], done:false, challengeIdx:null, sipCount:null, log:[], pubgolfDone:false, pubgolfEntryIdx:0,
    specialRuleKey:undefined, hadForfeit:false
  }, r, {log: Array.isArray(r.log)?r.log:[]}));
  s.usedCards = Array.isArray(l.usedCards)?l.usedCards:[];
  s.usedForfeits = Array.isArray(l.usedForfeits)?l.usedForfeits:[];
  s.usedRules = Array.isArray(l.usedRules)?l.usedRules:[];
  s.usedChaos = Array.isArray(l.usedChaos)?l.usedChaos:[];
  s.usedBounties = Array.isArray(l.usedBounties)?l.usedBounties:[];
  s.chaosLog = Array.isArray(l.chaosLog)?l.chaosLog:[];
  s.activeSpecialRule = null; // never resume mid-rule; re-rolled per stop
  s.activeBounty = l.activeBounty||null;
  s.lastArrivalEventKey = l.lastArrivalEventKey||null;
  s.pendingTreasure = typeof l.pendingTreasure==='number' ? l.pendingTreasure : null;
  s.soundOn = typeof l.soundOn==='boolean'? l.soundOn : true;
  s.crawlDNA = l.crawlDNA||null;
  s.usedWedgeDares = Array.isArray(l.usedWedgeDares)?l.usedWedgeDares:[];
  s.rules = Array.isArray(l.rules)?l.rules:d.rules;
  if(typeof s.currentStop!=='number' || s.currentStop>=s.route.length) s.currentStop=0;
  if(!['title','sips','turns','challenge','battle','summary'].includes(s.stopPhase)) s.stopPhase='title';
  // never resume mid-battle without a valid pair
  if(s.stopPhase==='battle' && (!Array.isArray(s.battlePair)||s.battlePair.length!==2)) s.stopPhase='summary';
  // if mid-turn, rebuild the queue so the game can't deadlock
  if(s.stopPhase==='turns'){
    if(!Array.isArray(s.turnQueue) || !s.turnQueue.length || s.turnQueue.some(i=>i>=s.players.length)){
      s.turnQueue = s.players.map((p,i)=>i);
      s.turnDrawsLeft = {};
      s.players.forEach((p,i)=>s.turnDrawsLeft[i]=s.drawsPerStop||1);
    }
  }
  s.secretShown=false;
  return s;
}
let userTouchedBeforeHydrate = false;
function boot(){
  // Paint immediately. Storage must never be able to block the UI.
  initDelegation();
  document.addEventListener('click', ()=>{ userTouchedBeforeHydrate = true; startMusic(); }, {capture:true});
  refillDeckPool();
  try{ render(); }catch(e){ showFatal(e); return; }
  hydrate();
}
async function hydrate(){
  if(!window.storage) return;
  try{
    const timeout = new Promise((_,rej)=>setTimeout(()=>rej(new Error('storage timeout')),1500));
    const r = await Promise.race([window.storage.get('crawlquest-v5', false), timeout]);
    if(r && r.value){
      // The player may already be mid-setup by the time this resolves —
      // never silently clobber real, in-progress input with an old save.
      if(userTouchedBeforeHydrate) return;
      const l = JSON.parse(r.value);
      if(isValidState(l) && l.screen && l.screen!=='intro'){
        state = migrate(l);
        refillDeckPool();
        render();
        showToast('Resumed your saved crawl','💾');
      }
    }
  }catch(e){ /* no save, or storage unavailable — carry on with a fresh game */ }
}
function showFatal(e){
  const app=document.getElementById('app');
  if(app) app.innerHTML='<div class="panel" style="text-align:center;"><h3>SOMETHING BROKE</h3>'
    +'<div style="font-size:12px;color:var(--ink-dim);margin-bottom:12px;">'+(e&&e.message?e.message:'Unknown error')+'</div>'
    +'<button class="btn block" data-do="resetGame">Reset and start over</button></div>';
}

/* ---------------- UTIL ---------------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function eligibleCards(){ return DECK.map((c,i)=>i).filter(i=>(state.allow18||DECK[i].spice==="clean") && !state.usedCards.includes(i)); }
function refillDeckPool(){
  let pool = eligibleCards();
  if(pool.length < 3){ state.usedCards = []; pool = eligibleCards(); showToast("Deck reshuffled","🔄"); }
  deckPool = shuffle(pool);
}
function typeLabel(t){ return {truth:"Hot Seat",dare:"Dare",challenge:"Challenge",trivia:"Trivia",sidequest:"Side Quest"}[t]; }
function typeClass(t){ return "type-"+t; }
function petByKey(k){ return PETS.find(p=>p.key===k) || PETS[0]; }
function markUsed(i){ if(!state.usedCards.includes(i)) state.usedCards.push(i); }
function pickForfeit(){
  let avail = FORFEITS.filter(f=>!state.usedForfeits.includes(f.text));
  if(avail.length===0){ state.usedForfeits=[]; avail=FORFEITS.slice(); }
  const f = avail[Math.floor(Math.random()*avail.length)];
  state.usedForfeits.push(f.text);
  return f;
}
function forfeitOptions(n){
  // "intense" tier is reserved for a lost Double or Nothing gamble — never
  // appears on a normal spin, or it stops feeling like a real escalation.
  const pool = FORFEITS.filter(f=>f.tier!=="intense");
  let avail = pool.filter(f=>!state.usedForfeits.includes(f.text));
  if(avail.length<n){ avail = pool.slice(); }
  return shuffle(avail).slice(0,n);
}
function awardPoints(idx, pts, opts){
  opts = opts||{};
  const p = state.players[idx];
  const wasLeader = isLeader(idx);
  const priorMax = Math.max(...state.players.map(x=>x.score));
  const deficitBefore = priorMax - p.score;
  if(deficitBefore > p.wasBehindBy) p.wasBehindBy = deficitBefore;

  let final = pts;
  const rule = state.activeSpecialRule;
  if(rule && rule.key==="double" && !opts.noRule) final*=2;
  if(rule && rule.key==="leader_handicap" && !opts.noRule && wasLeader) final=Math.round(final*0.75);
  if(p.doubleArmed && !opts.noCombo){ final*=2; p.doubleArmed=false; }
  if(!opts.noCombo){
    p.combo = (p.combo||0)+1;
    if(p.combo>(p.bestCombo||0)) p.bestCombo=p.combo;
    if(p.combo===3){ final=Math.round(final*1.15); checkObjective(idx,'combo_three',true); }
    if(p.combo===5){ p.doubleArmed=true; showToast(p.name+" hit a 5-combo — next card pays double!","🔥"); unlockAchievement(idx,'combo_king'); }
    if(p.combo>=7 && !p.bonusPowers.some(x=>x.type==='shield'&&!x.used)){ p.bonusPowers.push({type:'shield',used:false}); showToast(p.name+"'s combo earned a Shield!","🛡️"); }
  }
  if(rule && rule.key==="steal_round" && !opts.noRule){
    const others=state.players.map((x,i)=>i).filter(i=>i!==idx);
    if(others.length){ const t=others[Math.floor(Math.random()*others.length)]; const steal=Math.min(5,state.players[t].score); state.players[t].score-=steal; final+=steal; }
  }
  p.score += final;
  p.cardsCompleted = (p.cardsCompleted||0)+1;
  if(p.cardsCompleted===1 && state.players.every(x=>(x.cardsCompleted||0)<=1)) unlockAchievement(idx,'first_blood');

  const newW = wedgesForScore(p.score);
  if(newW > p.wedges){
    p.wedges = newW;
    const tier=tierForScore(p.score);
    setTimeout(()=>celebrate(idx,"WEDGE EARNED!", tier.name+" tier — pick a dare from the hat, hand it to a rival", true),400);
    playSound('wedge');
  }
  if(p.wedges>=3) unlockAchievement(idx,'wedge_hoarder');
  if(!wasLeader && isLeader(idx) && deficitBefore>=40) unlockAchievement(idx,'comeback_kid');
  return final;
}
function isLeader(idx){
  const s=state.players[idx].score;
  return s>0 && s===Math.max(...state.players.map(p=>p.score)) && state.players.filter(p=>p.score===s).length===1;
}
function logToStop(e){ state.route[state.currentStop].log.push(e); }

/* ---------------- AVATAR SVG ---------------- */
function personSVG(av, size){
  size = size||70;
  const h = size*1.55;
  const bt = av.bodyType||"regular";
  const torsoW = bt==="slim"?26:(bt==="broad"?38:32);
  const torsoX = 30 - torsoW/2;
  const armX1 = torsoX - 9, armX2 = torsoX + torsoW;

  let legs="";
  if(av.outfitStyle==="dress"){
    legs = `<path d="M${torsoX-4},58 L14,92 L46,92 L${torsoX+torsoW+4},58 Z" fill="${av.bottom}"/>
            <rect x="22" y="88" width="6" height="8" fill="${av.skin}"/><rect x="32" y="88" width="6" height="8" fill="${av.skin}"/>`;
  } else if(av.outfitStyle==="skirt"){
    legs = `<path d="M${torsoX-2},58 L18,76 L42,76 L${torsoX+torsoW+2},58 Z" fill="${av.bottom}"/>
            <rect x="21" y="74" width="7" height="22" rx="2" fill="${av.skin}"/><rect x="32" y="74" width="7" height="22" rx="2" fill="${av.skin}"/>`;
  } else if(av.outfitStyle==="shorts"){
    legs = `<rect x="19" y="58" width="10" height="16" rx="2" fill="${av.bottom}"/><rect x="31" y="58" width="10" height="16" rx="2" fill="${av.bottom}"/>
            <rect x="20" y="72" width="8" height="24" rx="2" fill="${av.skin}"/><rect x="32" y="72" width="8" height="24" rx="2" fill="${av.skin}"/>`;
  } else {
    legs = `<rect x="19" y="58" width="10" height="38" rx="2" fill="${av.bottom}"/><rect x="31" y="58" width="10" height="38" rx="2" fill="${av.bottom}"/>`;
  }

  let hair="";
  const hc = av.hairColor;
  switch(av.hairStyle){
    case "bob": hair=`<path d="M14,20 Q14,-2 46,-2 Q46,20 46,20 L46,34 Q42,26 30,26 Q18,26 14,34 Z" fill="${hc}"/>`; break;
    case "long": hair=`<path d="M13,18 Q13,-3 47,-3 Q47,18 47,18 L47,52 Q43,44 43,30 L17,30 Q17,44 13,52 Z" fill="${hc}"/>`; break;
    case "curly": hair=`<circle cx="18" cy="12" r="8" fill="${hc}"/><circle cx="30" cy="6" r="9" fill="${hc}"/><circle cx="42" cy="12" r="8" fill="${hc}"/><circle cx="14" cy="22" r="6" fill="${hc}"/><circle cx="46" cy="22" r="6" fill="${hc}"/>`; break;
    case "buzz": hair=`<path d="M16,16 Q30,2 44,16 L44,12 Q30,4 16,12 Z" fill="${hc}"/>`; break;
    case "mohawk": hair=`<path d="M26,14 Q30,-8 34,14 Z" fill="${hc}"/><path d="M16,16 Q30,8 44,16 L44,14 Q30,10 16,14 Z" fill="${hc}" opacity=".6"/>`; break;
    case "bun": hair=`<circle cx="30" cy="-1" r="7" fill="${hc}"/><path d="M15,15 Q30,-1 45,15 L45,10 Q30,2 15,10 Z" fill="${hc}"/>`; break;
    case "waves": hair=`<path d="M14,18 Q16,0 30,1 Q44,0 46,18 Q42,10 38,14 Q34,8 30,12 Q26,8 22,14 Q18,10 14,18 Z" fill="${hc}"/>`; break;
    default: hair=`<path d="M15,14 Q30,-5 45,14 L45,9 Q30,1 15,9 Z" fill="${hc}"/>`;
  }

  let hat="";
  switch(av.hat){
    case "cap": hat=`<path d="M14,10 Q30,-5 46,10 L46,13 L14,13 Z" fill="${av.top}"/><rect x="44" y="10" width="12" height="4" rx="2" fill="${av.top}"/>`; break;
    case "beanie": hat=`<path d="M14,12 Q30,-6 46,12 Z" fill="${av.top}"/><rect x="13" y="10" width="34" height="6" rx="3" fill="${av.top}"/>`; break;
    case "fedora": hat=`<ellipse cx="30" cy="12" rx="24" ry="5" fill="#241640"/><path d="M19,12 Q19,-2 41,-2 Q41,12 41,12 Z" fill="#241640"/><rect x="19" y="7" width="22" height="4" fill="${av.top}"/>`; break;
    case "crown": hat=`<path d="M16,10 L16,-2 L23,6 L30,-5 L37,6 L44,-2 L44,10 Z" fill="#ffd700"/><circle cx="30" cy="1" r="2.5" fill="#ff2fa6"/>`; break;
    case "band": hat=`<rect x="13" y="9" width="34" height="5" rx="2.5" fill="${av.top}"/>`; break;
  }

  return `<svg viewBox="-8 -10 76 108" width="${size}" height="${h}" style="overflow:visible;display:block;">
    ${legs}
    <rect x="${torsoX}" y="32" width="${torsoW}" height="28" rx="8" fill="${av.top}"/>
    <rect x="${armX1}" y="34" width="9" height="24" rx="4" fill="${av.skin}"/>
    <rect x="${armX2}" y="34" width="9" height="24" rx="4" fill="${av.skin}"/>
    <rect x="26" y="27" width="8" height="7" fill="${av.skin}"/>
    <circle cx="30" cy="17" r="14" fill="${av.skin}"/>
    ${hair}
    ${hat}
    <text x="30" y="23" font-size="13" text-anchor="middle">${av.face||"😊"}</text>
  </svg>`;
}

/* ---------------- RENDER ROOT ---------------- */
function render(){
  mountOverlays();
  closeAllOverlays();
  document.body.setAttribute('data-theme', state.theme||'neon');
  const fns={intro:renderIntro, lobby:renderLobby, hidden:renderHidden, play:renderPlay, routemap:renderRouteMap, mountain:renderMountain, stats:renderStats, end:renderEnd};
  const fn = fns[state.screen] || fns.intro;
  try{
    document.getElementById('app').innerHTML = fn();
  }catch(e){ showFatal(e); return; }
  try{ attachHandlers(); }catch(e){ console.error('handler error',e); }
  saveState();
  if(state.screen==="play") startPopupTimer(); else stopPopupTimer();
}

function navBar(active){
  return `<div class="top-nav">

  <div class="sound-toggle" data-do="toggleSound">${state.soundOn?'🔊':'🔇'}</div>`;
}
function renderPlay(){
  const stop=stopObj();
  if(stop.challengeIdx===null){
    const pool=DECK.map((c,i)=>i).filter(i=>(DECK[i].type==="challenge"||DECK[i].type==="trivia")&&(state.allow18||DECK[i].spice==="clean")&&!state.usedCards.includes(i));
    const src = pool.length? pool : DECK.map((c,i)=>i).filter(i=>DECK[i].type==="challenge");
    stop.challengeIdx = src[Math.floor(Math.random()*src.length)];
  }
  if(stop.arrivalEvent===undefined){
    stop.arrivalEvent = stop.pin ? null : rollArrivalEvent(stop);
  }
  if(stop.challengeMode===undefined){
    if(state.players.length<2){ stop.challengeMode='card'; }
    else{
      const r=Math.random();
      stop.challengeMode = r<0.38 ? 'card' : (r<0.68 ? 'trivia' : 'duel');
    }
  }
  if(stop.specialRuleKey===undefined){
    stop.specialRuleKey = null;
    if(!stop.pin && Math.random()<0.4){
      let avail = SPECIAL_RULES.filter(r=>!state.usedRules.includes(r.key));
      if(!avail.length){ state.usedRules=[]; avail=SPECIAL_RULES.slice(); }
      const rule = avail[Math.floor(Math.random()*avail.length)];
      state.usedRules.push(rule.key);
      stop.specialRuleKey = rule.key;
      state.activeSpecialRule = rule;
      if(rule.key==="bonus_wedge"){
        const i=Math.floor(Math.random()*state.players.length);
        state.players[i].wedges=Math.min(MAX_WEDGES,state.players[i].wedges+1);
        setTimeout(()=>showToast(state.players[i].name+" got a free wedge from BONUS WEDGE!","🎡"),400);
      }
    } else {
      state.activeSpecialRule = null;
    }
  } else if(stop.specialRuleKey){
    state.activeSpecialRule = SPECIAL_RULES.find(r=>r.key===stop.specialRuleKey) || null;
  } else {
    state.activeSpecialRule = null;
  }
  if(state.stopPhase==="title") return renderStopTitle(stop);
  if(state.stopPhase==="sips") return renderSips(stop);
  if(state.stopPhase==="turns") return renderTurns(stop);
  if(state.stopPhase==="challenge") return renderChallengePhase(stop);
  if(state.stopPhase==="battle") return renderBattlePhase(stop);
  if(state.stopPhase==="summary") return renderSummary(stop);
  return "";
}

/* ---------------- MOUNTAIN (STAIRS) ---------------- */
function renderMountain(){
  const W=320, steps=MOUNTAIN_STEPS, stepW=24, stepH=30;
  const baseY=60+steps*stepH, H=baseY+58;
  const sorted=[...state.players].map(p=>p).sort((a,b)=>b.score-a.score);
  const leadScore=Math.max(...state.players.map(p=>p.score));

  let stairs="";
  for(let i=0;i<steps;i++){
    const x=26+i*stepW, y=baseY-(i+1)*stepH, hgt=(i+1)*stepH;
    const reached=state.players.some(pl=>Math.floor((pl.score/SUMMIT_SCORE)*steps)>i);
    stairs+=`<rect x="${x}" y="${y+5}" width="${stepW}" height="${hgt-5}" fill="${reached?'rgba(139,61,255,.30)':'rgba(255,255,255,.05)'}" stroke="rgba(255,255,255,.12)" stroke-width="1"/>`;
    stairs+=`<rect x="${x-2}" y="${y}" width="${stepW+4}" height="6" rx="2" fill="${reached?'var(--c1)':'var(--c5)'}" opacity="${reached?'.95':'.45'}"/>`;
    if(i%2===0) stairs+=`<text x="${x+stepW/2}" y="${y+21}" font-size="7" fill="rgba(255,255,255,.5)" text-anchor="middle" font-family="monospace">${Math.round(((i+1)/steps)*SUMMIT_SCORE)}</text>`;
  }
  const summitX=26+(steps-1)*stepW;

  // Avatars are HTML layered above the SVG (nested SVG scaling is unreliable)
  const tokens=[...state.players].map((p,i)=>({p,i}))
    .sort((a,b)=>a.p.score-b.p.score)
    .map(({p,i})=>{
      const frac=Math.min(1,p.score/SUMMIT_SCORE);
      const st=Math.min(steps-1,Math.floor(frac*steps));
      const x=26+st*stepW+stepW/2+(i%2?7:-7);
      const y=baseY-(st+1)*stepH;
      const isLead=p.score===leadScore&&leadScore>0;
      return `<div class="peak-token ${isLead?'lead':''}" style="left:${(x/W)*100}%; top:${(y/H)*100}%;">
        <div class="peak-av">${personSVG(p.avatar,26)}</div>
        <div class="peak-tag">${isLead?'👑 ':''}${p.name}</div>
      </div>`;
    }).join('');

  return `${navBar('mountain')}
  <div class="mountain-scene">
    <div class="peak-stage">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="pkSky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--c5)" stop-opacity=".45"/>
            <stop offset="100%" stop-color="var(--void)" stop-opacity="0"/></linearGradient>
          <linearGradient id="pkBeam" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--c4)" stop-opacity=".4"/>
            <stop offset="100%" stop-color="var(--c4)" stop-opacity="0"/></linearGradient>
        </defs>
        <rect x="0" y="0" width="${W}" height="${H}" fill="url(#pkSky)"/>
        <circle cx="272" cy="50" r="22" fill="var(--c4)" opacity=".16"/>
        <circle cx="272" cy="50" r="13" fill="var(--c4)" opacity=".3"/>
        ${[[40,40],[96,26],[150,56],[214,34],[300,104],[62,88],[186,18],[248,126],[130,14]]
          .map(([x,y],k)=>`<circle cx="${x}" cy="${y}" r="${k%3===0?1.8:1.1}" fill="#fff" opacity=".6"/>`).join('')}
        <rect x="${summitX-6}" y="${baseY-steps*stepH-36}" width="${stepW+14}" height="36" fill="url(#pkBeam)"/>
        ${stairs}
        <g transform="translate(${summitX+6},${baseY-steps*stepH-38})">
          <rect x="7" y="4" width="2.5" height="34" fill="var(--c4)"/>
          <path d="M9.5,5 L27,11 L9.5,17 Z" fill="var(--c1)"/>
        </g>
        <rect x="0" y="${baseY}" width="${W}" height="4" fill="var(--c5)" opacity=".7"/>
        <text x="10" y="${baseY+21}" font-size="8" fill="var(--ink-dim)" font-family="monospace">BASE</text>
        <text x="${W-10}" y="${baseY+21}" font-size="8" fill="var(--c4)" text-anchor="end" font-family="monospace">SUMMIT ${SUMMIT_SCORE}</text>
      </svg>
      ${tokens}
    </div>
    <div class="mtn-board">
      ${sorted.map((p,rank)=>{
        const pct=Math.min(100,Math.round((p.score/SUMMIT_SCORE)*100));
        const behind=rank===0?null:sorted[0].score-p.score;
        const tier=tierForScore(p.score);
        return `<div class="mtn-row ${rank===0?'lead':''}">
          <div class="mtn-rank">${rank===0?'👑':'#'+(rank+1)}</div>
          <div class="mtn-av">${personSVG(p.avatar,24)}</div>
          <div class="mtn-info">
            <div class="mtn-name">${p.name}<span style="color:${tier.color};font-size:9.5px;margin-left:6px;">${tier.name}</span></div>
            <div class="mtn-bar"><i style="width:${pct}%"></i></div>
          </div>
          <div class="mtn-score"><b>${p.score}</b><span>${behind===null?pct+'%':'-'+behind}</span></div>
        </div>`;
      }).join('')}
    </div>
  </div>
  <div class="footer-note">Each step is ${Math.round(SUMMIT_SCORE/MOUNTAIN_STEPS)} points. First wedge at ${WEDGE_THRESHOLDS[0]}, next at ${WEDGE_THRESHOLDS[1]} — it gets harder from there.</div>
  <button class="btn secondary block" id="backToPlay2">← Back to Play</button>`;
}

/* ---------------- END ---------------- */
function finalizeAchievements(){
  const max=Math.max(...state.players.map(p=>p.score));
  const winners=state.players.filter(p=>p.score===max);
  const margin = state.players.length>1 ? max - Math.min(...state.players.map(p=>p.score)) : 0;
  if(winners.length===1){
    const wi=state.players.indexOf(winners[0]);
    if(margin>=100) unlockAchievement(wi,'unbeatable');
    if((winners[0].wasBehindBy||0)>=50) unlockAchievement(wi,'underdog');
  }
}
function renderEnd(){
  const pending=state.players.find(p=>p.hiddenDone===null);
  if(pending){
    return `<div class="hero"><div style="font-size:44px;text-align:center;">🤫</div>
      <h1 class="arcade" style="font-size:14px;text-align:center;">ONE LAST THING, ${pending.name.toUpperCase()}</h1></div>
      <div class="panel hidden-reveal"><div style="font-size:11.5px;color:var(--ink-dim);">Your hidden mission was:</div>
      <div class="badge" style="display:inline-block;">${pending.hiddenTier} TIER</div>
      <div class="hc-text">${pending.hiddenChallenge}</div>
      <div style="font-size:11.5px;color:var(--ink-dim);margin-bottom:6px;">Be honest. Did you pull it off?</div>
      <div class="yn"><button class="btn" data-hc="yes">Yes! +${pending.hiddenPts}</button><button class="btn secondary" data-hc="no">Not tonight</button></div></div>`;
  }
  finalizeAchievements();
  const max=Math.max(...state.players.map(p=>p.score));
  const winners=state.players.filter(p=>p.score===max);
  const tie=winners.length>1;

  let bestStop='', bestStopPts=0;
  state.route.forEach(s=>{ const t=s.log.reduce((sum,l)=>sum+(l.pts||0),0); if(t>bestStopPts){ bestStopPts=t; bestStop=s.name; } });
  let comebackName='', comebackAmt=0;
  state.players.forEach(p=>{ if((p.wasBehindBy||0)>comebackAmt){ comebackAmt=p.wasBehindBy; comebackName=p.name; } });
  const totalForfeits = state.players.reduce((s,p)=>s+(p.forfeitsTaken||0),0);
  const allAch = [...new Set(state.players.flatMap(p=>p.achievements))];

/* Global click delegation — immune to re-render timing and stale nodes */
function initDelegation(){
  document.addEventListener('click', function(e){
    const el = e.target.closest && e.target.closest('[data-do]');
    if(!el) return;
    const act = el.getAttribute('data-do');
    if(act==='startFromIntro'){
      const inp=document.getElementById('introCrawlName');
      if(inp && inp.value.trim()) state.crawlName=inp.value.trim();
      state.screen='lobby'; render();
    }
    else if(act==='revealSecret'){ state.secretShown=true; render(); }
    else if(act==='secretNext'){ state.secretShown=false; state.hiddenRevealIdx++; render(); }
    else if(act==='beginCrawl'){ state.secretShown=false; state.screen='play'; render(); }
    else if(act==='resetGame'){
      if(confirm('Start over? This wipes all scores and setup.')){
        try{ if(window.storage) window.storage.delete('crawlquest-v5', false).catch(()=>{}); }catch(err){}
        state = defaultState(); render();
      }
    }
    else if(act==='endCrawl'){
      if(confirm('End the crawl now and jump to final results?')){
        state.screen='end'; render();
      }
    }
    else if(act==='toggleSound'){ state.soundOn=!state.soundOn; if(state.soundOn) startMusic(); else stopMusic(); render(); }
    else if(act==='closeChaos'){ const b=document.getElementById('chaosBannerHost'); if(b) b.innerHTML=''; }
    else if(act==='viewAvatar'){ openAvatarPortal(+el.dataset.idx); }
    else if(act==='closeAvatarPortal'){ const ov=document.getElementById('petOverlay'); if(ov) ov.classList.add('hidden'); }
  }, false);
}

function endHandlers(){
  document.querySelectorAll('[data-hc]').forEach(b=>b.onclick=()=>{
    const p=state.players.find(pl=>pl.hiddenDone===null);
    p.hiddenDone=b.dataset.hc==="yes";
    if(p.hiddenDone){
      p.score+=p.hiddenPts;
      if(p.hiddenTier==='LEGENDARY') unlockAchievement(state.players.indexOf(p),'legendary_crawl');
      const others=state.players.map((x,i)=>i).filter(i=>state.players[i]!==p);
      if(Math.min(...state.players.map(x=>x.score))===p.score) unlockAchievement(state.players.indexOf(p),'last_place_legend');
    }

  });
  const sb=document.getElementById('shareBtn'); if(sb)sb.onclick=doShare;
  const ag=document.getElementById('playAgain');
  if(ag)ag.onclick=()=>{
    const keep=state.players.map(p=>({name:p.name,avatar:p.avatar,pet:{key:p.pet.key,used:false}}));
    state={...state, screen:"lobby", lobbyTab:"crew",
      players:keep.map(k=>({...freshPlayer(k.name),avatar:k.avatar,pet:k.pet})),
      activePlayerTab:0,
      route:DEFAULT_ROUTE.map((s,i)=>({...s,icon:STOP_ICONS[i%STOP_ICONS.length],done:false,challengeIdx:null,sipCount:null,log:[]})),
      currentStop:0, stopPhase:"title", turnQueue:[], turnDrawsLeft:{},
      hiddenRevealIdx:0, hiddenAssigned:false, usedCards:[], usedForfeits:[], usedWedgeDares:[],
      usedRules:[], usedChaos:[], usedBounties:[], activeSpecialRule:null, activeBounty:null,

function doShare(){
  const sorted=[...state.players].sort((a,b)=>b.score-a.score);
  const allAch=[...new Set(state.players.flatMap(p=>p.achievements))].map(k=>{const d=ACHIEVEMENTS.find(a=>a.key===k);return d?d.name:k;});
  let bestStop='', bestStopPts=0;
  state.route.forEach(s=>{ const t=s.log.reduce((sum,l)=>sum+(l.pts||0),0); if(t>bestStopPts){ bestStopPts=t; bestStop=s.name; } });
  const lines=[
    "🕹️ CRAWL QUEST — "+state.crawlName,
    "",
    ...sorted.map((p,i)=>`${i+1}. ${p.name}: ${p.score} pts (${tierForScore(p.score).name})`),
    "",
    bestStop? "Best stop: "+bestStop+" (+"+bestStopPts+")" : "",
    "Chaos Events: "+state.chaosLog.length,
    allAch.length? "Achievements: "+allAch.join(", ") : "",
    "",
    "Prize: "+state.reward
  ].filter(Boolean);
  const text=lines.join("\n");
  if(navigator.share){ navigator.share({title:"Crawl Quest",text}).catch(()=>{}); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(text).then(()=>showToast("Recap copied!","📋")); }
  else showToast("Couldn't share","⚠️");
}

/* ---------------- PLAY HANDLERS ---------------- */
function playHandlers(){
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{state.screen=b.dataset.nav;render();});
  const ph=state.stopPhase;
  if(ph==="title"){
    document.getElementById('beginStopBtn').onclick=()=>{
      const stop=stopObj();
      beginTurns(effectiveDrawsPerStop());
      render();
    };
  }
  if(ph==="sips"){
    const sipBtn=document.getElementById('spinSipBtn');
    sipBtn.onclick=()=>{
      sipBtn.disabled=true; // belt-and-braces: even the safe overlay path shouldn't be re-entered mid-spin
      openWheel("How many sips?", ["1 card each","2 cards each","3 cards each","4 cards each","5 cards each","6 cards each"], (landedText)=>{
        const sips = landedText ? (parseInt(landedText,10)||1) : 1;
        stopObj().sipCount=sips;
        beginTurns(sips);
        render();
      });
    };
  }
  if(ph==="turns"){
    renderChoiceCards();
    const pb=document.getElementById('passTurnBtn');
    if(pb)pb.onclick=()=>{
      state.turnQueue.shift();
      if(!state.turnQueue.length){
        const stop=stopObj();
        if(stop.challengeMode==='duel' && state.players.length>=2){
          state.battlePair=shuffle(state.players.map((p,i)=>i)).slice(0,2);
          state.battleStake=26;
          state.battleType=shuffle(['tap','reaction','memory'])[0];
          state.stopPhase="battle";
        } else state.stopPhase="challenge";
      }
      render();
    };
    hookWheels(); hookPowers();
  }
  if(ph==="challenge"){
    document.getElementById('startCountdown').onclick=()=>{
      if(stopObj().challengeMode==='trivia') runGroupTrivia();
      else openChallenge();
    };
    hookWheels();
  }
  if(ph==="battle"){
    document.getElementById('startBattle').onclick=()=>{
      const t=state.battleType||'tap';
      if(t==='reaction') runReactionDuel(0,{});
      else if(t==='memory') runMemoryDuel(0,{});
      else if(t==='trivia') runTriviaDuel();
      else runBattle(0,{});
    };
    document.getElementById('skipBattle').onclick=()=>{state.stopPhase="summary";render();};
  }
  if(ph==="summary"){
    const stop=stopObj();
    if(stop.pubgolf && !stop.pubgolfDone){
      document.querySelectorAll('[data-golf]').forEach(b=>b.onclick=()=>{
        const sips=+b.dataset.golf;
        const idx=stop.pubgolfEntryIdx||0;
        const p=state.players[idx];
        const tier=golfTierForSips(sips);
        const f=awardPoints(idx,tier.pts,{noCombo:true});
        logToStop({player:p.name,type:"sidequest",text:"[Pub Golf] "+sips+" sip"+(sips===1?'':'s')+" — "+tier.label,pts:f});
        if(tier.pts>=25){ celebrate(idx,tier.emoji+" "+tier.label, p.name+" — "+sips+" sip"+(sips===1?'':'s')+" for +"+f+" points", true); }
        else showToast(tier.emoji+" "+p.name+": "+tier.label+" — +"+f+" points","⛳");
        stop.pubgolfEntryIdx=idx+1;
        if(stop.pubgolfEntryIdx>=state.players.length) stop.pubgolfDone=true;
        render();
      });
    } else {
      const nb=document.getElementById('nextStopBtn');
      if(nb) nb.onclick=()=>{ stopObj().done=true; maybeForcedPopup(advanceStop); };
    }
  }
}
const GOLF_TIERS = [
  {max:1, label:"HOLE IN ONE!", pts:50, emoji:"🏌"},
  {max:2, label:"EAGLE", pts:35, emoji:"🦅"},
  {max:3, label:"BIRDIE", pts:25, emoji:"🐦"},
  {max:4, label:"PAR", pts:15, emoji:"⛳"},
  {max:5, label:"BOGEY", pts:8, emoji:"😬"},
  {max:6, label:"DOUBLE BOGEY", pts:3, emoji:"😩"},
  {max:Infinity, label:"TRIPLE BOGEY+", pts:0, emoji:"💀"},
];
function golfTierForSips(n){ return GOLF_TIERS.find(t=>n<=t.max); }
function effectiveDrawsPerStop(){
  if(state.drawsPerStopManual) return state.drawsPerStop;
  return state.players.length===2 ? 2 : 1;
}
function beginTurns(draws){
  state.turnQueue=state.players.map((p,i)=>i);
  state.turnDrawsLeft={};
  state.players.forEach((p,i)=>state.turnDrawsLeft[i]=draws);
  state.stopPhase="turns";
}
function advanceStop(){
  maybeAssignBounty();
  const after = ()=>{
    if(state.currentStop<state.route.length-1){ state.currentStop++; state.stopPhase="title"; }
    else state.screen="end";
    render();
  };
  maybeMysteryReward(()=> maybeChaosEvent(after));
}
function hookWheels(){
  const d=document.getElementById('spinDrink'); if(d)d.onclick=()=>openWheel("What are you drinking?",DRINK_WHEEL,null,{onLanded:(t)=>maybeWheelJackpot(t)});
  const f=document.getElementById('spinFood'); if(f)f.onclick=()=>openWheel("What are you eating?",FOOD_WHEEL,null,{onLanded:(t)=>maybeWheelJackpot(t)});
}
function hookPowers(){
  document.querySelectorAll('[data-power]').forEach(c=>c.onclick=()=>confirmUsePet(+c.dataset.power));
  document.querySelectorAll('[data-wedge]').forEach(c=>c.onclick=()=>useWedge(+c.dataset.wedge));
}

/* ---------------- CARD DRAW ---------------- */
function renderChoiceCards(){
  const row=document.getElementById('choiceRow');
  if(!row) return;
  if(deckPool.length<3) refillDeckPool();
  const offered=deckPool.slice(-3);
  row.innerHTML=offered.map((x,s)=>`<div class="mini-card-back" data-slot="${s}">?</div>`).join('');
  row.querySelectorAll('.mini-card-back').forEach(el=>{
    el.onclick=()=>{
      const slot=+el.dataset.slot, chosen=offered[slot];
      deckPool.splice(deckPool.length-3,3);
      offered.forEach((oi,s)=>{ if(s!==slot) deckPool.unshift(oi); });
      openPersonalCard(chosen, state.turnQueue[0]);
    };
  });
}
function flipReveal(idx, onReady){
  const ov=document.getElementById('cardOverlay');
  if(!ov){ onReady(DECK[idx]); return; }
  ov.classList.remove('hidden');
  const fc=document.getElementById('flipcard');
  fc.classList.remove('flipped');
  document.getElementById('cardControls').classList.add('hidden');
  const c=DECK[idx];
  document.getElementById('cardFront').innerHTML=`
    <div class="spice ${c.spice==='spicy'?'spice-spicy':'spice-clean'}">${c.spice==='spicy'?'18+':'CLEAN'}</div>
    <div class="type ${typeClass(c.type)}">${c.cat==='chaos'?'⚡ CHAOS CARD':typeLabel(c.type)}</div>
    <div class="txt">${c.text}</div><div class="pts">+${c.pts} pts</div>`;
  if(c.cat==='chaos') fc.classList.add('chaos-card'); else fc.classList.remove('chaos-card');
  setTimeout(()=>fc.classList.add('flipped'),120);
  setTimeout(()=>{document.getElementById('cardControls').classList.remove('hidden');onReady(c);},650);
  fc.onclick=()=>{if(!fc.classList.contains('flipped'))fc.classList.add('flipped');};

      <div class="arcade" style="font-size:11px;color:var(--ink-dim);" id="btime">10.0s</div>`;
    const target=document.getElementById('tapT');

      document.getElementById('btimer').style.width=Math.max(0,(t/10)*100)+"%";

        target.removeEventListener('pointerdown',bump);

/* ---------------- FORFEITS ---------------- */
function triggerForfeit(targetIdx, done){
  const p=state.players[targetIdx], pet=petByKey(p.pet.key);
  p.combo = 0;
  p.forfeitsTaken = (p.forfeitsTaken||0)+1;
  if(p.forfeitsTaken>=3) unlockAchievement(targetIdx,'forfeit_magnet');
  state.route[state.currentStop].hadForfeit = true;
  playSound('forfeit');
  const shieldIdx = (p.bonusPowers||[]).findIndex(x=>x.type==='shield'&&!x.used);
  const rule = state.activeSpecialRule;
  const finish = ()=>{
    if(rule && rule.key==="reverse"){ const c=Math.round(6+Math.random()*6); awardPoints(targetIdx,c,{noCombo:true,noRule:true}); showToast(p.name+" gets "+c+" consolation points (Reverse Scoring)","↩️"); }
    if(done) done();
  };
  if(shieldIdx>=0){
    const host=document.getElementById('toastHost');
    if(host){
      host.innerHTML=`<div class="quest-toast"><div class="qtxt"><b>${p.name.toUpperCase()} HAS A SHIELD</b>Block this forfeit automatically?</div>
        <button id="useShield">Block it</button><button id="skipShield">Take it anyway</button></div>`;
      document.getElementById('useShield').onclick=()=>{ p.bonusPowers[shieldIdx].used=true; host.innerHTML=""; showToast(p.name+"'s shield absorbs the forfeit!","🛡️"); finish(); };
      document.getElementById('skipShield').onclick=()=>{ host.innerHTML=""; continueForfeit(); };
      return;
    }
  }
  continueForfeit();
  function continueForfeit(){
    const host=document.getElementById('toastHost');
    if(!p.pet.used && (pet.key==="fox"||pet.key==="turtle") && host){
      host.innerHTML=`<div class="quest-toast"><div class="qtxt"><b>${p.name.toUpperCase()} FACES A FORFEIT</b>Use ${pet.em} ${pet.name}?</div>
        <button id="usePet">Use</button><button id="skipPet">Spin</button></div>`;
      document.getElementById('usePet').onclick=()=>{
        p.pet.used=true; host.innerHTML="";
        if(pet.key==="fox"){ showToast(p.name+" escapes the forfeit!","🦊"); unlockAchievement(targetIdx,'foxed_luck'); finish(); }
        else pickForfeitManually(targetIdx,finish);
      };
      document.getElementById('skipPet').onclick=()=>{ host.innerHTML=""; spinForfeit(targetIdx,finish); };
    } else spinForfeit(targetIdx,finish);
  }
}

  if(pool.length<3){ state.usedWedgeDares=[]; pool=WEDGE_DARES[tier.key]; }
  const offered=shuffle(pool).slice(0,3);
  const others=state.players.map((p,i)=>i).filter(i=>i!==giverIdx);

  const ov=document.getElementById('cardOverlay');
  ov.classList.remove('hidden');
  const fc=document.getElementById('flipcard');
  fc.classList.add('flipped');
  document.getElementById('cardFront').innerHTML=`<div class="type type-dare" style="background:${tier.color};color:#000!important;">${tier.name.toUpperCase()} WEDGE</div>
    <div class="txt">Pick a card from the hat and hand it to a player.</div>
    <div class="pts">Their loss, your gain</div>`;

function confirmUsePet(idx){
  const p=state.players[idx];
  if(p.pet.used){ showToast(petByKey(p.pet.key).name+"'s power is already used tonight.", petByKey(p.pet.key).em); return; }
  const pet=petByKey(p.pet.key);
  const passive = pet.key==="fox" || pet.key==="turtle";
  if(passive){ showToast(pet.name+" triggers automatically when "+p.name+" faces a forfeit.", pet.em); return; }
  const host=document.getElementById('toastHost');
  if(!host){ usePet(idx); return; }
  host.innerHTML=`<div class="quest-toast" style="flex-direction:column;align-items:stretch;">
    <div class="qtxt"><b>${pet.em} USE ${pet.name.toUpperCase()}?</b>${pet.trait}</div>
    <div class="yn" style="margin-top:8px;"><button class="btn" id="petUseYes">Use it</button><button class="btn secondary" id="petUseNo">Not yet</button></div></div>`;
  document.getElementById('petUseYes').onclick=()=>{ host.innerHTML=""; usePet(idx); };
  document.getElementById('petUseNo').onclick=()=>{ host.innerHTML=""; };
}
function usePet(idx){
  const p=state.players[idx];
  if(p.pet.used) return;
  const k=p.pet.key;
  if(k==="owl"){ p.pet.used=true; if(deckPool.length>=3)deckPool.splice(deckPool.length-3,3); showToast(p.name+"'s Owl dealt fresh cards","🦉"); render(); }
  else if(k==="octopus"){ p.pet.used=true; p.doubleArmed=true; showToast(p.name+"'s next card pays double","🐙"); render(); }
  else if(k==="unicorn"){ p.pet.used=true; showToast(p.name+" can force one respin","🦄"); render(); }
  else if(k==="wolf"){
    const others=state.players.map((x,i)=>i).filter(i=>i!==idx);
    if(!others.length) return;
    const t=others[Math.floor(Math.random()*others.length)];
    const steal=Math.min(15,state.players[t].score);
    state.players[t].score-=steal; p.score+=steal; p.pet.used=true;
    celebrate(idx,"WOLF STRIKE!",`Took ${steal} from ${state.players[t].name}`);
    setTimeout(render,1500);
  }
  else if(k==="raven"){
    const others=state.players.map((x,i)=>i).filter(i=>i!==idx);
    if(!others.length) return;
    const t=others[Math.floor(Math.random()*others.length)];
    p.pet.used=true;
    showToast(`${state.players[t].name}'s mission: ${state.players[t].hiddenChallenge}`,"🐦‍⬛");
    render();
  }
  else if(k==="dragon"){
    const others=state.players.map((x,i)=>i).filter(i=>i!==idx);
    if(!others.length) return;
    const t=others[Math.floor(Math.random()*others.length)];
    p.pet.used=true;
    state.battlePair=[idx,t]; state.battleStake=20; state.stopPhase="battle";
    showToast(p.name+" calls a Dragon duel!","🐉");
    render();
  }
  else showToast(petByKey(k).name+" triggers when you face a forfeit.",petByKey(k).em);
}

/* ---------------- WHEELS ---------------- */
function numberWheelSVG(n){
  const cx=100,cy=100,r=98; let s="";
  for(let i=0;i<n;i++){
    const a0=(i/n)*2*Math.PI-Math.PI/2, a1=((i+1)/n)*2*Math.PI-Math.PI/2;
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    const lg=(a1-a0)>Math.PI?1:0;
    s+=`<path d="M${cx},${cy} L${x0.toFixed(2)},${y0.toFixed(2)} A${r},${r} 0 ${lg} 1 ${x1.toFixed(2)},${y1.toFixed(2)} Z" fill="${WHEEL_COLORS[i%WHEEL_COLORS.length]}" stroke="#0a0118" stroke-width="2"/>`;
    const mid=(a0+a1)/2,tr=r*0.68;
    const tx=cx+tr*Math.cos(mid),ty=cy+tr*Math.sin(mid),rot=(mid*180/Math.PI)+90;
    s+=`<text x="${tx.toFixed(2)}" y="${ty.toFixed(2)}" fill="#0a0118" font-size="18" font-weight="900" font-family="'Press Start 2P',sans-serif" text-anchor="middle" transform="rotate(${rot.toFixed(1)} ${tx.toFixed(2)} ${ty.toFixed(2)})">${i+1}</text>`;
  }
  return s;
}
function spinWheel(elId,n,onLand){
  const el=document.getElementById(elId);
  el.style.transition="none"; el.style.transform="rotate(0deg)";
  void el.offsetWidth;
  const seg=360/n, w=Math.floor(Math.random()*n);
  const final=5*360+(360-(w*seg+seg/2));
  el.style.transition="transform 3.2s cubic-bezier(.15,.75,.2,1)";
  el.style.transform=`rotate(${final}deg)`;
  setTimeout(()=>onLand(w),3300);
}
function openWheel(title, items, onClose, opts){
  opts = opts || {};
  const ov=document.getElementById('wheelOverlay');
  if(!ov){ if(onClose)onClose(); return; }
  ov.classList.remove('hidden');
  document.getElementById('wheelTitle').textContent=title;
  document.getElementById('wheelSvg2').innerHTML=numberWheelSVG(items.length);
  document.getElementById('wheelResult2').innerHTML="&nbsp;";
  document.getElementById('wheelExtra').innerHTML="";
  const closeBtn=document.getElementById('closeWheel');
  closeBtn.textContent = opts.closeLabel || "Close";
  let landedText=null;
  document.getElementById('spinBtn2').onclick=()=>{
    playSound('spin');
    document.getElementById('wheelExtra').innerHTML="";
    spinWheel('wheelEl2',items.length,(w)=>{
      landedText=items[w];
      document.getElementById('wheelResult2').innerHTML=`<div class="rev-num">NUMBER ${w+1}</div><div class="rev-txt">${items[w]}</div>`;
      playSound('land');
      if(opts.onLanded) opts.onLanded(landedText, w);
    });
  };
  closeBtn.onclick=()=>{ ov.classList.add('hidden'); document.getElementById('wheelExtra').innerHTML=""; if(onClose)onClose(landedText); };
}

/* ---------------- CELEBRATE (queued so important moments never stack) ---------------- */
// Minor: brief, non-blocking auto-fade (~2.6s) — regular card points, small results.
// Major: needs a tap to dismiss (wedge, achievement, mini-game win, big moment) so it
// can never disappear before someone's read it; falls back to auto-dismiss after 8s
// in case nobody taps.
let celebrateQueue=[];
let celebrateBusy=false;
function celebrate(pIdx, title, sub, major){
  celebrateQueue.push({pIdx,title,sub,major:!!major});
  processCelebrateQueue();
}
function processCelebrateQueue(){
  if(celebrateBusy || !celebrateQueue.length) return;
  celebrateBusy=true;
  const {pIdx,title,sub,major}=celebrateQueue.shift();
  showCelebrateNow(pIdx,title,sub,major);
}
function showCelebrateNow(pIdx, title, sub, major){
  const p=state.players[pIdx];
  if(!p){ celebrateBusy=false; processCelebrateQueue(); return; }
  const el=document.createElement('div');
  el.className='celebrate'+(major?' major':'');
  el.innerHTML=`<div class="cel-char">${personSVG(p.avatar,110)}</div>
    <div class="cel-title">${title}</div>${sub?`<div class="cel-sub">${sub}</div>`:''}
    ${major?'<button class="btn block cel-gotit" style="max-width:200px;margin-top:22px;">Got it</button>':''}`;
  document.body.appendChild(el);
  const colors=["#ff2fa6","#25e6ff","#c6ff3d","#ffb703","#8b3dff"];
  for(let i=0;i<26;i++){
    const s=document.createElement('div');
    s.className='spark';
    s.style.background=colors[i%colors.length];
    s.style.left="50%"; s.style.top="45%";
    s.style.setProperty('--dx',(Math.random()*380-190)+"px");
    s.style.setProperty('--dy',(Math.random()*-300-40)+"px");
    s.style.animationDelay=(Math.random()*0.25)+"s";
    el.appendChild(s);
  }
  let dismissed=false;
  const dismiss=()=>{
    if(dismissed) return; dismissed=true;
    el.style.transition="opacity .35s"; el.style.opacity="0";
    setTimeout(()=>{ el.remove(); celebrateBusy=false; processCelebrateQueue(); },350);
  };
  if(major){
    const btn=el.querySelector('.cel-gotit');
    if(btn) btn.addEventListener('click', dismiss, {once:true});
    setTimeout(dismiss, 8000); // fallback if nobody taps
  } else {
    setTimeout(dismiss, 2600);
  }
}

/* ---- BACKGROUND MUSIC (same tiny synth engine, low volume, looping) ---- */
let musicInterval=null, musicStep=0;
const MUSIC_BASS=[110,110,130.81,98,110,110,146.83,98]; // simple 8-step minor-key loop
const MUSIC_LEAD=[0,220,0,261.63,0,220,293.66,0,0,220,0,196,0,220,246.94,0];
function playNote(ctx,freq,dur,type,vol){
  try{
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.value=freq; g.gain.value=vol;
    o.connect(g); g.connect(ctx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur);
    o.stop(ctx.currentTime+dur+0.02);
  }catch(e){}
}
function startMusic(){
  if(musicInterval || !state.soundOn) return;
  const ctx=getAudioCtx();
  if(!ctx) return;
  if(ctx.state==='suspended') ctx.resume().catch(()=>{});
  musicInterval=setInterval(()=>{
    if(!state.soundOn){ stopMusic(); return; }
    const ctx2=getAudioCtx();
    if(!ctx2){ stopMusic(); return; }
    playNote(ctx2, MUSIC_BASS[musicStep%MUSIC_BASS.length], 0.22, 'triangle', 0.032);
    const lead=MUSIC_LEAD[musicStep%MUSIC_LEAD.length];
    if(lead) playNote(ctx2, lead, 0.16, 'square', 0.018);
    musicStep++;
  }, 190);
}
function stopMusic(){ if(musicInterval){ clearInterval(musicInterval); musicInterval=null; } musicStep=0; }
let audioCtx=null;
function getAudioCtx(){
  if(!state.soundOn) return null;
  try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }catch(e){ return null; }
}
function playSound(kind){
  if(!state.soundOn) return;
  const ctx=getAudioCtx();
  if(!ctx) return;
  try{
    const map={
      point:[660,0.09], wedge:[880,0.14], forfeit:[220,0.16], spin:[440,0.06],
      land:[740,0.1], win:[990,0.18], chaos:[180,0.22], achievement:[1040,0.16]
    };
    const [freq,dur]=map[kind]||[500,0.08];
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type = kind==='forfeit'||kind==='chaos' ? 'sawtooth' : 'square';
    o.frequency.value=freq;
    g.gain.value=0.06;
    o.connect(g); g.connect(ctx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur);
    o.stop(ctx.currentTime+dur+0.02);
    if(kind==='win'||kind==='achievement'){
      setTimeout(()=>{ try{
        const o2=ctx.createOscillator(), g2=ctx.createGain();
        o2.type='square'; o2.frequency.value=freq*1.5; g2.gain.value=0.06;
        o2.connect(g2); g2.connect(ctx.destination); o2.start();
        g2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.15);
        o2.stop(ctx.currentTime+0.17);
      }catch(e){} },120);
    }
  }catch(e){}
}

function unlockAchievement(idx, key){
  const p=state.players[idx];
  if(!p || p.achievements.includes(key)) return;
  p.achievements.push(key);
  const def=ACHIEVEMENTS.find(a=>a.key===key);
  if(!def) return;
  playSound('achievement');
  setTimeout(()=>celebrate(idx,"ACHIEVEMENT: "+def.name.toUpperCase(), def.desc, true),600);
}

/* ---- OBJECTIVES (crawl-wide, tracked passively) ---- */
function checkObjective(idx, key, conditionMet){
  if(!conditionMet) return;
  const p=state.players[idx];
  if(!state.crawlDNA || !state.crawlDNA.objectives.includes(key)) return;
  if(p.objectiveProgress[key]) return;
  p.objectiveProgress[key]=true;
  const def=OBJECTIVES.find(o=>o.key===key);
  if(!def) return;
  applyReward(idx, def.reward, "OBJECTIVE COMPLETE", def.text);
}
function applyReward(idx, reward, title, desc){
  const p=state.players[idx];
  if(reward.type==='points'){ const f=awardPoints(idx,reward.amount,{noCombo:true}); logToStop({player:p.name,type:"sidequest",text:"["+title+"] "+desc,pts:f}); celebrate(idx,title,"+"+f+" points — "+desc); }
  else if(reward.type==='wedge'){ p.wedges=Math.min(MAX_WEDGES,p.wedges+reward.amount); celebrate(idx,title,"+"+reward.amount+" wedge — "+desc, true); }
  else if(reward.type==='multiplier'){ p.doubleArmed=true; celebrate(idx,title,"Next card pays double — "+desc); }
  else if(reward.type==='power'){ p.bonusPowers.push({type:reward.power||'shield',used:false}); celebrate(idx,title,"New power — "+desc); }
  playSound('wedge');
}

/* ---- BOUNTIES ---- */
function maybeAssignBounty(){
  if(state.activeBounty) return;
  if(Math.random()>0.35) return;
  let avail=BOUNTIES.filter(b=>!state.usedBounties.includes(b.key));
  if(!avail.length){ state.usedBounties=[]; avail=BOUNTIES.slice(); }
  const b=avail[Math.floor(Math.random()*avail.length)];
  state.usedBounties.push(b.key);
  state.activeBounty={...b, claimed:false};
  setTimeout(()=>showToast("New Bounty: "+b.text,"🎯"),300);
}
function checkBounty(kind, idx){
  const b=state.activeBounty;
  if(!b || b.claimed) return;
  if(kind==='clean' && b.key==='clean_stop'){
    const stop=state.route[state.currentStop];
    if(!stop.hadForfeit){
      // award to whichever player currently leads the stop, fallback to player 0
      const lead=state.players.reduce((best,p,i)=> p.score>state.players[best].score?i:best,0);
      claimBounty(lead,b);
    }
  }
  if(kind==='minigame' && b.key==='beat_leader_minigame' && typeof idx==='number'){
    claimBounty(idx,b);
  }
  if(kind==='don_win' && b.key==='double_or_nothing_win' && typeof idx==='number'){
    claimBounty(idx,b);
  }
}
function claimBounty(idx,b){
  b.claimed=true;
  applyReward(idx, b.reward, "BOUNTY CLAIMED", b.text);
  state.activeBounty=null;
}

// Only one chaos banner may be visible/pending at a time. A queue means a
// second trigger (e.g. one nested inside a Mystery Box outcome) waits its
// turn instead of racing the first and leaving something undismissable.
let chaosQueueBusy=false;
function pickAndApplyChaos(){
  let avail=CHAOS_EVENTS.filter(e=>!state.usedChaos.includes(e.key));
  if(!avail.length){ state.usedChaos=[]; avail=CHAOS_EVENTS.slice(); }
  const ev=avail[Math.floor(Math.random()*avail.length)];

  state.chaosLog.push(ev.key);
  applyChaosEvent(ev);
  return ev;
}
function showChaosBanner(ev, onClosed){
