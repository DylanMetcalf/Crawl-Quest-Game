<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0a30"/>
      <stop offset="100%" stop-color="#08010f"/>
    </linearGradient>
    <linearGradient id="peak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff2fa6"/>
      <stop offset="100%" stop-color="#8b3dff"/>
    </linearGradient>
    <linearGradient id="peak2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#25e6ff"/>
      <stop offset="100%" stop-color="#8b3dff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- back peak -->
  <path d="M256 128 L372 340 H140 Z" fill="url(#peak2)" opacity="0.85"/>
  <!-- front peak, offset for depth -->
  <path d="M198 190 L300 372 H96 Z" fill="url(#peak)"/>
  <!-- snow cap accent on front peak -->
  <path d="M198 190 L222 232 L198 224 L174 232 Z" fill="#fff" opacity="0.92"/>

  <!-- quest marker: a small diamond/waypoint above the summit -->
  <path d="M256 90 L276 112 L256 134 L236 112 Z" fill="#c6ff3d"/>

  <!-- baseline -->
  <rect x="72" y="372" width="368" height="14" rx="7" fill="#ffffff" opacity="0.08"/>
</svg>
